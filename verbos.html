<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Азбука">
<title>50 Verbos — Ruso por temas</title>
<link rel="stylesheet" href="core.css">
<style>
  /* Específico de este módulo: flashcards, menú de práctica y detalle
     de conjugación — no están en core.css porque son patrones únicos
     de esta app. Sin header propio: el título vive en el contenido
     (renderHome) y el ☰ vive en el nav inferior, igual que Alfabeto. */
  .conjrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .conjrow:last-child{border-bottom:none;}
  .pron{color:var(--muted);font-size:12px;}
  .flash{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:34px 16px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;user-select:none;}
  .flash .big{font-family:var(--serif);font-size:28px;color:var(--gold);}
  .flash .small{color:var(--sub);font-size:14px;}
  .pmgrid{display:grid;gap:10px;}
  .pmc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s;}
  .pmc:hover{border-color:var(--gold);}
  .pmc .ic{font-size:22px;}
  .pmc b{display:block;font-size:14.5px;}
  .pmc span{font-size:12px;color:var(--muted);}
  .dim{color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<div id="overlay"></div>
<div id="drawer">
  <div class="dh"><a id="homeBtnDrawer" href="index.html">🏠 Inicio</a></div>
  <div class="drawer-search">
    <input type="text" id="drawerSearch" placeholder="Buscar…" autocomplete="off">
  </div>
  <div id="drawerUnits"></div>
  <div id="drawerFoot">
    <button id="themeBtnDrawer" aria-label="Cambiar tema"></button>
  </div>
</div>

<div id="content"><div class="inner" id="app"></div></div>

<nav id="bnav">
  <button class="nb" id="menuBtn"><span class="ni">☰</span><span>Menú</span></button>
  <button class="nb ac" id="nav-home"><span class="ni">🏠</span><span>Módulos</span></button>
  <button class="nb" id="nav-practice"><span class="ni">🎯</span><span>Practicar</span></button>
  <button class="nb" id="nav-stats"><span class="ni">📊</span><span>Progreso</span></button>
</nav>

<div id="toast"></div>
<script src="core.js"></script>
<script src="data-alphabet.js"></script>
<script src="data-diccionario.js"></script>
<script src="data-verbos.js"></script>
<script src="data-casos.js"></script>
<script src="data-azbuka2.js"></script>
<script src="data-azbuka3.js"></script>
<script src="data-dialogos.js"></script>
<script>
// MODULES y verbs se cargan desde data-verbos.js (compartido con index.html para el buscador)
// El SRS usa el infinitivo como identidad persistente estable; no requiere cambios en data-verbos.js.

/* ============ ESTADO (en memoria, sesión actual) ============ */
// srs (dominio por verbo 0-4) se carga/guarda vía azModule('verbos').srs.
// history queda solo en memoria de la sesión; attempts/correct acumulados
// sí persisten en azModule('verbos').stats para que "Precisión" sobreviva
// a un reload.
const state = { srs:{}, history:[], view:{name:'home'} };
// Identidad persistente estable: el infinitivo ruso no depende del orden de MODULES.
// Los ids numéricos siguen usándose para navegación dentro de la página, pero no para SRS.
function verbKey(v){ return v.inf; }
verbs.forEach(v=>state.srs[verbKey(v)]=0);
function levelName(l){return ["Nuevo","Aprendido","En práctica","Dominado","Automático"][l];}
function levelClass(l){return l===0?'s0':(l<3?'s1':'s2');}

// speak() ya viene de core.js

const app = document.getElementById('app');

function render(){
  const v = state.view;
  let html='';
  if(v.name==='home') html=renderHome();
  else if(v.name==='module') html=renderModule(v.moduleN);
  else if(v.name==='verb') html=renderVerb(v.verbId);
  else if(v.name==='practice') html=renderPracticeMenu();
  else if(v.name==='flashcards') html=renderFlashcards();
  else if(v.name==='caseEx') html=renderCaseExercise();
  else if(v.name==='fillblank') html=renderFillBlank();
  else if(v.name==='stats') html=renderStats();
  app.innerHTML = `<div class="view">${html}</div>`;
  attachHandlers();
}

function renderHome(){
  let out = `<div class="ey">Curso</div><h1 class="pt">Los 50 verbos más usados</h1>
  <p class="ps">Organizados en 10 bloques temáticos: cada módulo gira en torno a una situación real, así reutilizas vocabulario y avanzas con contexto.</p>
  <div class="ugrid">`;
  MODULES.forEach(mod=>{
    const mv = verbs.filter(x=>x.module===mod.n);
    const avg = mv.reduce((a,x)=>a+state.srs[verbKey(x)],0)/mv.length;
    out += `<div class="uc" data-mod="${mod.n}">
      <span class="un">${mod.n}</span>
      <div class="ut">${mod.title}</div>
      <div class="ud">${mod.desc}</div>
      <div class="pb"><div style="width:${avg/4*100}%"></div></div>
      <div class="upc">${mv.length} verbos · ${Math.round(avg/4*100)}%</div>
    </div>`;
  });
  out += `</div>`;
  return out;
}

function renderModule(n){
  const mod = MODULES.find(m=>m.n===n);
  const mv = verbs.filter(x=>x.module===n);
  let out = `<button class="abk" data-go="home">← Módulos</button>
  <div class="ey">Módulo ${n}</div><h1 class="pt">${mod.title}</h1>
  <p class="ps">${mod.obj}</p>`;
  mv.forEach(v=>{
    out += `<div class="wr" data-verb="${v.id}">
      <div style="flex:1">
        <div class="wru">${v.inf}</div>
        <div class="wes">${v.es}</div>
      </div>
      <span class="stb ${levelClass(state.srs[verbKey(v)])}">${levelName(state.srs[verbKey(v)])}</span>
    </div>`;
  });
  return out;
}

function renderVerb(id){
  const v = verbs.find(x=>x.id===id);
  const mod = MODULES.find(m=>m.n===v.module);
  const forms=["я","ты","он/она","мы","вы","они"];
  let out = `<button class="abk" data-go="module" data-mod="${v.module}">← ${mod.title}</button>
  <div class="dh2">
    <div class="dbig">${v.inf}</div>
    <div class="di">
      <h3>${v.es}</h3>
      <span class="pch">${'★'.repeat(v.freq)}${'☆'.repeat(5-v.freq)}</span>
      <span class="pch">${v.aspect==='impf'?'Imperfectivo':v.aspect==='perf'?'Perfectivo':'Bispecto'}</span>
      <span class="pch">${levelName(state.srs[verbKey(v)])}</span>
    </div>
    <button class="psm" data-speak="${v.inf}">🔊</button>
  </div>

  <div class="sh"><h2>Conjugación</h2><span class="shs">${v.tense==='fut'?'Futuro simple':'Presente'}</span></div>
  <div class="card sb">
  ${forms.map((f,i)=>`<div class="conjrow"><span class="pron">${f}</span><span>${v.conj[i]}</span><button class="psm" data-speak="${v.conj[i]}" style="width:26px;height:26px;font-size:11px">🔊</button></div>`).join('')}
  </div>

  <div class="sh"><h2>Caso que rige</h2></div>
  <div class="dgrid sb">
    <div class="db"><div class="dbl">Caso</div><p>${v.case_}</p></div>
    <div class="db"><div class="dbl">Uso</div><p>${v.caseNote}</p></div>
  </div>

  <div class="sh"><h2>Ejemplos</h2></div>
  <div class="sb">${v.ex.map(e=>`<div class="wr" style="cursor:default"><div style="flex:1"><div class="wru" style="font-size:16px">${e[0]}</div><div class="wes">${e[1]}</div></div><button class="psm" data-speak="${e[0]}">🔊</button></div>`).join('')}</div>

  <div class="sh"><h2>Vocabulario asociado</h2></div>
  <div class="sr sb">${v.vocab.map(w=>`<div class="sc"><span class="sv" style="font-size:15px">${w[0]}</span><span class="sl">${w[1]}</span></div>`).join('')}</div>

  <button class="btn pr" data-practice-verb="${v.id}">Practicar este verbo</button>`;
  return out;
}

function renderPracticeMenu(){
  return `<div class="ey">Práctica</div><h1 class="pt">Elige un modo</h1>
  <div class="pmgrid sb">
    <div class="pmc" data-go="flashcards"><span class="ic">🃏</span><div><b>Flashcards</b><span>Repetición espaciada, prioriza lo que menos dominas</span></div></div>
    <div class="pmc" data-go="caseEx"><span class="ic">🎯</span><div><b>Elegir el caso correcto</b><span>Refuerza qué caso rige cada verbo</span></div></div>
    <div class="pmc" data-go="fillblank"><span class="ic">✏️</span><div><b>Completar la conjugación</b><span>Practica las formas verbales</span></div></div>
  </div>
  <div class="card"><p class="dim">Cada verbo tiene un nivel de 0 (nuevo) a 4 (automático). Acertar sube de nivel; fallar te devuelve práctica más frecuente de ese verbo.</p></div>`;
}

function pickVerbWeighted(){
  const weights = verbs.map(v=>5-state.srs[verbKey(v)]+0.5);
  const total = weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<verbs.length;i++){ r-=weights[i]; if(r<=0) return verbs[i]; }
  return verbs[0];
}

let currentDrill = null;

function newFlashcard(){
  const v = pickVerbWeighted();
  const dir = Math.random()<0.5?'ru-es':'es-ru';
  currentDrill = {type:'flash', verb:v, dir, revealed:false};
}
function renderFlashcards(){
  if(!currentDrill||currentDrill.type!=='flash') newFlashcard();
  const {verb,dir,revealed}=currentDrill;
  const front = dir==='ru-es'?verb.inf:verb.es;
  const back = dir==='ru-es'?verb.es:verb.inf;
  return `<button class="abk" data-go="practice">← Practicar</button>
  <div class="qh">Nivel: ${levelName(state.srs[verbKey(verb)])} · Módulo ${verb.module}</div>
  <div class="flash" id="flashcard">
    <div class="big">${front}</div>
    ${revealed?`<div class="small">${back}</div>`:'<div class="small">Toca para revelar</div>'}
  </div>
  ${revealed?`<div class="qopts" style="margin-top:14px">
    <button class="qo" data-drill-answer="know">✅ Lo sabía</button>
    <button class="qo" data-drill-answer="unsure">🤔 Dudé</button>
    <button class="qo" data-drill-answer="fail">❌ No lo sabía</button>
  </div>`:''}`;
}

function renderCaseExercise(){
  if(!currentDrill||currentDrill.type!=='case'){
    const v = pickVerbWeighted();
    const others = [...new Set(verbs.map(x=>x.case_))].filter(c=>c!==v.case_ && c!=='—');
    const distractors = others.sort(()=>Math.random()-0.5).slice(0,3);
    const options = [v.case_,...distractors].sort(()=>Math.random()-0.5);
    currentDrill = {type:'case', verb:v, options, answered:false};
  }
  const {verb,options,answered,picked}=currentDrill;
  return `<button class="abk" data-go="practice">← Practicar</button>
  <div class="excard">
    <div class="qh">¿Qué caso rige este verbo?</div>
    <div class="qq" style="font-size:24px">${verb.inf} <span style="font-size:14px;color:var(--sub)">(${verb.es})</span></div>
    <div class="qopts">
      ${options.map(o=>`<button class="qo ${answered?(o===verb.case_?'co':(o===picked?'wr2':'')):''}" data-case-pick="${o}">${o}</button>`).join('')}
    </div>
    ${answered?`<p class="dim" style="margin-top:12px">${verb.caseNote}</p><button class="btn pr" data-go="caseEx">Siguiente →</button>`:''}
  </div>`;
}

function renderFillBlank(){
  if(!currentDrill||currentDrill.type!=='fill'){
    const v = pickVerbWeighted();
    const idx = Math.floor(Math.random()*6);
    const forms=["я","ты","он/она","мы","вы","они"];
    const correct = v.conj[idx];
    const distractors = v.conj.filter((c,i)=>i!==idx).sort(()=>Math.random()-0.5).slice(0,3);
    const options=[correct,...distractors].sort(()=>Math.random()-0.5);
    currentDrill = {type:'fill', verb:v, idx, options, correct, answered:false, forms};
  }
  const {verb,idx,options,correct,answered,picked,forms}=currentDrill;
  return `<button class="abk" data-go="practice">← Practicar</button>
  <div class="excard">
    <div class="qh">Completa la conjugación</div>
    <div class="qq">${verb.inf} <span style="font-size:13px;color:var(--sub)">(${verb.es})</span></div>
    <p style="margin-bottom:12px;color:var(--sub)">${forms[idx]} + ___</p>
    <div class="qopts">
      ${options.map(o=>`<button class="qo ${answered?(o===correct?'co':(o===picked?'wr2':'')):''}" data-fill-pick="${o}">${o}</button>`).join('')}
    </div>
    ${answered?`<button class="btn pr" data-go="fillblank">Siguiente →</button>`:''}
  </div>`;
}

function renderStats(){
  const total=verbs.length;
  const mastered=verbs.filter(v=>state.srs[verbKey(v)]>=3).length;
  const inProgress=verbs.filter(v=>state.srs[verbKey(v)]>0&&state.srs[verbKey(v)]<3).length;
  const st = azModule('verbos').stats || {attempts:0,correct:0};
  const acc=st.attempts?Math.round(st.correct/st.attempts*100):0;
  let out = `<div class="ey">Tu progreso</div><h1 class="pt">Estadísticas</h1>
  <div class="sr">
    <div class="sc"><span class="sv">${mastered}/${total}</span><span class="sl">Dominados</span></div>
    <div class="sc"><span class="sv">${inProgress}</span><span class="sl">En práctica</span></div>
    <div class="sc"><span class="sv">${acc}%</span><span class="sl">Precisión</span></div>
  </div>
  <div class="sh"><h2>Por módulo</h2></div>`;
  MODULES.forEach(mod=>{
    const mv = verbs.filter(v=>v.module===mod.n);
    const avg = mv.reduce((a,v)=>a+state.srs[verbKey(v)],0)/mv.length;
    out += `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${mod.n}. ${mod.title}</span><span class="dim">${Math.round(avg/4*100)}%</span></div><div class="pb"><div style="width:${avg/4*100}%"></div></div></div>`;
  });
  return out;
}

function updateSRS(verb, correct){
  const key = verbKey(verb);
  state.history.push({id:key,correct});
  if(correct){ state.srs[key]=Math.min(4,state.srs[key]+1); }
  else { state.srs[key]=Math.max(0,state.srs[key]-1); }
  const mod = azModule('verbos');
  mod.srs = state.srs;
  mod.stats = mod.stats || {attempts:0, correct:0};
  mod.stats.attempts++;
  if(correct) mod.stats.correct++;
  azTouchStudied();
  azSaveProgress();
}

function attachHandlers(){
  document.querySelectorAll('[data-mod]').forEach(el=>el.addEventListener('click',()=>{state.view={name:'module',moduleN:parseInt(el.dataset.mod)};render();}));
  document.querySelectorAll('[data-verb]').forEach(el=>el.addEventListener('click',()=>{state.view={name:'verb',verbId:parseInt(el.dataset.verb)};render();}));
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{
    const go=el.dataset.go;
    if(go==='home') state.view={name:'home'};
    else if(go==='module') state.view={name:'module',moduleN:parseInt(el.dataset.mod)};
    else if(go==='practice'){currentDrill=null;state.view={name:'practice'};}
    else if(go==='flashcards'){currentDrill=null;state.view={name:'flashcards'};}
    else if(go==='caseEx'){currentDrill=null;state.view={name:'caseEx'};}
    else if(go==='fillblank'){currentDrill=null;state.view={name:'fillblank'};}
    render();
  }));
  document.querySelectorAll('[data-practice-verb]').forEach(el=>el.addEventListener('click',()=>{currentDrill=null;state.view={name:'flashcards'};render();}));
  document.querySelectorAll('[data-speak]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();speak(el.dataset.speak);}));
  const fc=document.getElementById('flashcard');
  if(fc) fc.addEventListener('click',()=>{currentDrill.revealed=true;render();});
  document.querySelectorAll('[data-drill-answer]').forEach(el=>el.addEventListener('click',()=>{
    updateSRS(currentDrill.verb, el.dataset.drillAnswer==='know');
    newFlashcard(); render();
  }));
  document.querySelectorAll('[data-case-pick]').forEach(el=>el.addEventListener('click',()=>{
    if(currentDrill.answered) return;
    const pick=el.dataset.casePick;
    currentDrill.answered=true; currentDrill.picked=pick;
    updateSRS(currentDrill.verb, pick===currentDrill.verb.case_);
    render();
  }));
  document.querySelectorAll('[data-fill-pick]').forEach(el=>el.addEventListener('click',()=>{
    if(currentDrill.answered) return;
    const pick=el.dataset.fillPick;
    currentDrill.answered=true; currentDrill.picked=pick;
    updateSRS(currentDrill.verb, pick===currentDrill.correct);
    render();
  }));
}

document.getElementById('nav-home').addEventListener('click',()=>{state.view={name:'home'};setActiveNav('nav-home');render();});
document.getElementById('nav-practice').addEventListener('click',()=>{currentDrill=null;state.view={name:'practice'};setActiveNav('nav-practice');render();});
document.getElementById('nav-stats').addEventListener('click',()=>{state.view={name:'stats'};setActiveNav('nav-stats');render();});
function setActiveNav(id){document.querySelectorAll('#bnav .nb').forEach(b=>b.classList.remove('ac'));document.getElementById(id).classList.add('ac');}

(async () => {
  await azInit({activeType:'module', activeId:'verbos'});
  const saved = azModule('verbos').srs || {};
  // Compatibilidad con el formato anterior: si existe SRS numérico, se migra
  // al infinitivo estable. Las claves antiguas no se eliminan.
  verbs.forEach(v=>{
    const key = verbKey(v);
    if(saved[key]!==undefined) state.srs[key]=saved[key];
    else if(saved[v.id]!==undefined) state.srs[key]=saved[v.id];
  });
  const mod = azModule('verbos');
  mod.srs = state.srs;
  azSaveProgress();
  render();
})();
</script>
</body>
</html>
