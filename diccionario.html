<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Español → Ruso</title>
<style>
  :root {
    --bg:#0F0F14; --bg2:#17171E; --bg3:#1E1E28;
    --card:#1A1A24; --border:#2A2A38;
    --gold:#C9A84C; --goldD:#C9A84C33;
    --text:#F0EEE8; --muted:#888080; --sub:#B8B0A8;
    --accent:#4B6FAB; --green:#4CAF82; --orange:#E2884A; --purple:#9B7FE8;
    --red:#E2884A;
    --r:14px;
    --sans:-apple-system,"Inter","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overscroll-behavior:none;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s;}
  ::selection{background:var(--goldD);}
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 20px 12px;flex-shrink:0;z-index:100;}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .logo{display:flex;align-items:baseline;gap:8px;}
  .logo-es{font-family:var(--sans);font-size:19px;font-weight:700;color:var(--gold);letter-spacing:-.2px;}
  .logo-arrow{color:var(--muted);font-size:14px;}
  .logo-ru{font-family:var(--sans);font-size:17px;color:var(--purple);font-weight:600;}
  .stats{font-size:11px;color:var(--muted);}
  .search-wrap{position:relative;}
  #searchInput{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 36px 10px 38px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;}
  #searchInput:focus{border-color:var(--gold);}
  #searchInput::placeholder{color:var(--muted);}
  .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;opacity:.7;}
  .clear-btn{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px;display:none;}
  .clear-btn:hover{color:var(--gold);}

  .layout{display:flex;flex:1;overflow:hidden;}
  .sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:14px 0;width:180px;flex-shrink:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .sidebar-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;padding:0 14px 8px;}
  .cat-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;background:none;border:none;color:var(--sub);font-size:12.5px;cursor:pointer;text-align:left;transition:background .15s,color .15s;border-left:3px solid transparent;}
  .cat-btn:hover{background:var(--bg3);color:var(--text);}
  .cat-btn.active{background:var(--bg3);color:var(--gold);border-left-color:var(--gold);font-weight:600;}
  .cat-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
  .cat-count{margin-left:auto;font-size:10px;color:var(--muted);background:var(--border);padding:1px 6px;border-radius:8px;}

  .content{padding:22px;overflow-y:auto;flex:1;}
  .cat-header{display:flex;align-items:center;gap:13px;margin-bottom:20px;}
  .cat-header-icon{font-size:28px;}
  .cat-header-title{font-family:var(--sans);font-size:24px;font-weight:700;color:var(--gold);}
  .cat-header-ru{font-family:var(--sans);font-size:15px;color:var(--purple);margin-top:2px;font-weight:600;}
  .subcat{margin-bottom:26px;}
  .subcat-title{font-size:10.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:12px;}
  .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}

  .word-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:.15s;position:relative;}
  .word-card:hover{border-color:var(--gold);transform:translateY(-1px);}
  .word-card.flipped{border-color:var(--green);background:#1A241D;}
  .word-es{font-size:15px;font-weight:600;color:var(--text);margin-bottom:2px;}
  .word-gender{font-size:10px;color:var(--muted);font-style:italic;}
  .word-ru{font-family:var(--sans);font-size:16px;color:var(--green);margin-top:6px;display:none;font-weight:600;}
  .word-pronun{font-size:11px;color:var(--purple);margin-top:2px;font-style:italic;display:none;}
  .word-card.flipped .word-ru{display:block;}
  .word-card.flipped .word-pronun{display:none;}
  .word-card.flipped.show-pronun .word-pronun{display:block;}
  .flip-hint{position:absolute;top:8px;right:10px;font-size:10px;color:var(--muted);}

  .controls{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .ctrl-btn{background:var(--bg3);border:1px solid var(--border);color:var(--sub);padding:9px 15px;border-radius:10px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
  .ctrl-btn:hover{border-color:var(--gold);color:var(--gold);}
  .ctrl-btn.active{background:var(--gold);color:#0F0F14;border-color:var(--gold);font-weight:700;}
  .ctrl-btn.active2{background:var(--purple);color:#0F0F14;border-color:var(--purple);font-weight:700;}

  .quiz-wrap{max-width:460px;margin:0 auto;padding:24px 0;}
  .quiz-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:30px 26px;text-align:center;margin-bottom:20px;}
  .quiz-question{font-family:var(--sans);font-size:26px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .quiz-category{font-size:10.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:22px;font-weight:600;}
  .quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .quiz-opt{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 10px;cursor:pointer;transition:.15s;font-family:var(--sans);font-size:14.5px;color:var(--text);}
  .quiz-opt:hover{border-color:var(--gold);color:var(--gold);}
  .quiz-opt.correct{border-color:var(--green);background:#4CAF8222;color:var(--green);}
  .quiz-opt.wrong{border-color:var(--orange);background:#E2884A22;color:var(--orange);}
  .quiz-progress{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .quiz-bar-bg{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
  .quiz-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),#E2B86A);border-radius:3px;transition:width .3s;}
  .quiz-score{font-size:12.5px;color:var(--sub);white-space:nowrap;}
  .quiz-next{background:var(--gold);border:none;color:#0F0F14;padding:12px 28px;border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;display:none;margin:0 auto;font-family:inherit;}
  .quiz-next:hover{filter:brightness(1.08);}
  .quiz-result{text-align:center;padding:36px 20px;}
  .quiz-result-score{font-family:var(--sans);font-size:54px;font-weight:900;color:var(--gold);}
  .quiz-result-label{font-size:15.5px;color:var(--sub);margin:6px 0 22px;}

  .search-results-title{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14.5px;}

  @media(max-width:600px){
    .layout{flex-direction:column-reverse;}
    .sidebar{width:100%;height:auto;border-right:none;border-top:1px solid var(--border);padding:6px 0;overflow-x:auto;overflow-y:hidden;display:flex;flex-shrink:0;}
    .sidebar-label{display:none;}
    .cat-btn{flex-direction:column;gap:3px;padding:8px 12px;font-size:10.5px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
    .cat-btn.active{border-left-color:transparent;border-bottom-color:var(--gold);}
    .cat-count{display:none;}
    .content{padding:16px;}
    .word-grid{grid-template-columns:1fr 1fr;}
    .quiz-options{grid-template-columns:1fr;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

</head>
<body>
<header>
  <div class="header-top">
    <div class="logo">
      <span class="logo-es">Español</span>

      <span class="logo-ru">Русский</span>
    </div>
    <div class="stats" id="stats"></div>

  </div>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content"></main>
</div>

let currentCat=DATA[0].id, revealAll=false, showPronun=true, mode='browse', quizState=null;

function getAllWords(){const w=[];DATA.forEach(c=>c.subcats.forEach(s=>s.words.forEach(x=>w.push({es:x[0],ru:x[1],pronun:x[2],gender:x[3],cat:c.label}))));return w;}
function countWords(c){return c.subcats.reduce((a,s)=>a+s.words.length,0);}

function renderSidebar(){
  const nav=document.getElementById('sidebar');
  nav.innerHTML=`<div class="sidebar-label">Temas</div>`+DATA.map(c=>`<button class="cat-btn ${c.id===currentCat?'active':''}" onclick="selectCat('${c.id}')"><span class="cat-icon">${c.icon}</span><span>${c.label}</span><span class="cat-count">${countWords(c)}</span></button>`).join('');
  document.getElementById('stats').textContent=`${getAllWords().length} palabras · ${DATA.length} temas`;
}

function selectCat(id){currentCat=id;mode='browse';revealAll=false;document.getElementById('searchInput').value='';document.getElementById('clearBtn').style.display='none';renderSidebar();renderContent();}

function renderContent(){
  const cat=DATA.find(c=>c.id===currentCat);
  if(!cat)return;
  const el=document.getElementById('content');
  const pronunBtn=`<button class="ctrl-btn ${showPronun?'active2':''}" onclick="togglePronun()">${showPronun?'🔤 Ocultar pronunc.':'🔤 Ver pronunc.'}</button>`;
  const controls=`<div class="controls">
    <button class="ctrl-btn ${mode==='browse'?'active':''}" onclick="setMode('browse')">📖 Explorar</button>
    <button class="ctrl-btn ${mode==='quiz'?'active':''}" onclick="setMode('quiz')">🎯 Quiz</button>
    ${mode==='browse'?`<button class="ctrl-btn ${revealAll?'active':''}" onclick="toggleReveal()">${revealAll?'🙈 Ocultar ruso':'👁 Revelar ruso'}</button>`:''}
    ${mode==='browse'?pronunBtn:''}
  </div>`;
  if(mode==='quiz'){el.innerHTML=controls+renderQuiz(cat);bindQuizEvents();return;}
  const header=`<div class="cat-header"><span class="cat-header-icon">${cat.icon}</span><div><div class="cat-header-title">${cat.label}</div><div class="cat-header-ru">${cat.labelRu}</div></div></div>`;
  const subs=cat.subcats.map(s=>`<div class="subcat"><div class="subcat-title">${s.title}</div><div class="word-grid">${s.words.map(w=>cardHTML(w)).join('')}</div></div>`).join('');
  el.innerHTML=controls+header+subs;
}

function cardHTML(w){
  const[es,ru,p,g]=w;
  const pronunEl=`<div class="word-pronun">${p}</div>`;
  const flippedClass=revealAll?'flipped':'';
  const pronunClass=showPronun?'show-pronun':'';
  return `<div class="word-card ${flippedClass} ${pronunClass}" onclick="this.classList.toggle('flipped')">
    <span class="flip-hint">${revealAll?'':'▶'}</span>
    <div class="word-es">${es}</div>
    ${g?`<div class="word-gender">${g}</div>`:''}
    <div class="word-ru">${ru}</div>
    ${pronunEl}
  </div>`;
}

function toggleReveal(){revealAll=!revealAll;renderContent();}
function togglePronun(){showPronun=!showPronun;renderContent();}
function setMode(m){mode=m;if(m==='quiz')initQuiz();renderContent();}

function initQuiz(){const cat=DATA.find(c=>c.id===currentCat);const words=[];cat.subcats.forEach(s=>s.words.forEach(w=>words.push(w)));quizState={words:[...words].sort(()=>Math.random()-.5),index:0,correct:0,answered:false};}

function renderQuiz(cat){
  if(!quizState)initQuiz();
  const qs=quizState;
  if(qs.index>=qs.words.length){
    const pct=Math.round(qs.correct/qs.words.length*100);
    const em=pct>=80?'🏆':pct>=50?'💪':'📚';
    return `<div class="quiz-wrap"><div class="quiz-result"><div class="quiz-result-score">${em} ${pct}%</div><div class="quiz-result-label">${qs.correct} de ${qs.words.length} correctas</div><button class="ctrl-btn active" onclick="initQuiz();renderContent()">Repetir quiz</button></div></div>`;
  }
  const word=qs.words[qs.index];
  const allRu=[];cat.subcats.forEach(s=>s.words.forEach(w=>allRu.push(w[1])));
  const opts=[word[1],...allRu.filter(r=>r!==word[1]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
  const prog=qs.index/qs.words.length*100;
  return `<div class="quiz-wrap"><div class="quiz-progress"><div class="quiz-bar-bg"><div class="quiz-bar-fill" style="width:${prog}%"></div></div><div class="quiz-score">✅ ${qs.correct} / ${qs.index}</div></div><div class="quiz-card"><div class="quiz-question">${word[0]}</div><div class="quiz-category">${DATA.find(c=>c.id===currentCat).label}</div><div class="quiz-options" id="quizOpts">${opts.map(o=>`<button class="quiz-opt" data-opt="${o.replace(/"/g,'&quot;')}" data-correct="${word[1].replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div></div><button class="quiz-next" id="quizNext" onclick="nextQ()">Siguiente →</button></div>`;
}

function bindQuizEvents(){document.querySelectorAll('.quiz-opt').forEach(b=>b.addEventListener('click',function(){if(quizState.answered)return;quizState.answered=true;const c=this.dataset.correct;document.querySelectorAll('.quiz-opt').forEach(x=>{if(x.dataset.opt===c)x.classList.add('correct');else if(x===this&&x.dataset.opt!==c)x.classList.add('wrong');});if(this.dataset.opt===c)quizState.correct++;document.getElementById('quizNext').style.display='block';}));}
function nextQ(){quizState.index++;quizState.answered=false;renderContent();}

function doSearch(q){
  const el=document.getElementById('content');
  if(!q){renderContent();return;}
  const res=getAllWords().filter(w=>w.es.toLowerCase().includes(q)||w.ru.includes(q)||w.pronun.toLowerCase().includes(q));
  if(!res.length){el.innerHTML=`<div class="empty">Sin resultados para "<strong>${q}</strong>"</div>`;return;}
  el.innerHTML=`<div class="search-results-title">🔍 ${res.length} resultado${res.length!==1?'s':''} para "<strong>${q}</strong>"</div><div class="word-grid">${res.map(w=>`<div class="word-card ${showPronun?'show-pronun':''}" onclick="this.classList.toggle('flipped')"><span class="flip-hint">▶</span><div class="word-es">${w.es}</div>${w.gender?`<div class="word-gender">${w.gender}</div>`:''}<div class="word-ru" style="display:block;color:var(--green)">${w.ru}</div><div class="word-pronun" style="display:block">${w.pronun}</div><div style="font-size:10px;color:var(--muted);margin-top:5px">${w.cat}</div></div>`).join('')}</div>`;
}

function clearSearch(){const i=document.getElementById('searchInput');i.value='';document.getElementById('clearBtn').style.display='none';renderContent();i.focus();}

document.getElementById('searchInput').addEventListener('input',function(){const q=this.value.trim().toLowerCase();document.getElementById('clearBtn').style.display=q?'block':'none';doSearch(q);});

renderSidebar();
renderContent();
</script>
