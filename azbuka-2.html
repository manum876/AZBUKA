<body>

<div id="overlay"></div>

  <div class="drawer-search">
    <input type="text" id="drawerSearch" placeholder="Buscar…" autocomplete="off">
  </div>

</div>

<div id="content">
  <section class="view active" id="view-unit2">
    <div class="inner">
      <div id="u2Header"></div>
      <div class="u1tabs" id="pips2"></div>
      <div id="u2Content"></div>
    </div>
  </section>
</div>

<nav id="bnav">
  <button class="nb" id="menuBtn"><span class="ni">☰</span><span>Menú</span></button>
  <div id="navMid"><b id="navTitleMain"></b></div>
  <div style="display:flex;gap:4px;">
    <button class="nb" id="prevBtn"><span class="ni">←</span><span>Anterior</span></button>
    <button class="nb" id="nextBtn"><span class="ni">→</span><span>Siguiente</span></button>
  </div>
</nav>
<div id="toast"></div>

<script src="core.js"></script>
<script src="data-alphabet.js"></script>
<script src="data-diccionario.js"></script>
<script src="data-verbos.js"></script>
<script src="data-casos.js"></script>
<script src="data-azbuka2.js"></script>
<script src="data-azbuka3.js"></script>
<script>
// sg/ss, tema, TTS, toast, drawer y AZ_UNITS → core.js
const toast = azToast; // alias de compatibilidad

const U2S=[
  {id:'intro',     lbl:'Intro',      ic:'📖'},
  {id:'modulos',   lbl:'Módulos',    ic:'💬'},
  {id:'palabras',  lbl:'Palabras',   ic:'📝'},
  {id:'dictado',   lbl:'Dictado',    ic:'🎧'},
  {id:'ejercicios',lbl:'Escritura',  ic:'⚡'},
  {id:'evaluacion',lbl:'Evaluación', ic:'🎯'},
];


// ── STATE Unidad 2 ───────────────────────────────
let MOD2_PROG={}; // {moduleId: 0|1|2}  0=nuevo 1=en progreso 2=dominado
let mod2View='grid';
let mod2Selected=null;
let LAST_WRONG2=[]; // últimos ítems fallados, para el repaso inteligente

function saveMod2(){ azUnit(2).mod2=MOD2_PROG; azSaveProgress(); }
function words2(){
  const out=[];
  MODULES2.forEach(m=>m.vocab.forEach((w,wi)=>out.push({id:m.id+'_'+wi,ru:w.ru,tr:w.tr,es:w.es,moduleId:m.id})));
  return out;
}
function mod2Dominated(){return Object.values(MOD2_PROG).filter(v=>v===2).length;}
function u2Pct(){return Math.round(mod2Dominated()/MODULES2.filter(m=>m.vocab.length).length*100);}

// ── UNIDAD 2 — RENDER PRINCIPAL ──────────────────
function renderU2(){
  const hdr=document.getElementById('u2Header');
  if(hdr)hdr.innerHTML=`<div class="ey">Unidad 2 · Presentaciones y conversaciones básicas</div>`;
  renderU2Tabs();
  const el=document.getElementById('u2Content');
  if(!el)return;
  el.innerHTML='';
  const fn={intro:renderIntro2,modulos:renderModulos,palabras:renderPalabras2,dictado:renderDictado2,ejercicios:renderEjercicios2,evaluacion:renderEvaluacion2}[U2S[CURR_SEC].id];
  if(fn)fn(el);
}
function renderU2Tabs(){
  const el=document.getElementById('pips2');
  if(!el)return;
  el.innerHTML='';
  U2S.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='u1tab'+(i===CURR_SEC?' cu':i<CURR_SEC?' dn':'');
    b.innerHTML=`<span>${s.ic}</span><span>${s.lbl}</span>`;
    b.addEventListener('click',()=>navTo(i));
    el.appendChild(b);
  });
}

// ── INTRO ─────────────────────────────────────────
function renderIntro2(el){
  el.innerHTML=`
    <div class="sh"><span class="shi">📖</span><div><h2>Introducción</h2><div class="shs">El objetivo del mes: empezar a comunicarte de verdad</div></div></div>
    <div class="card sb">
      <p style="color:var(--sub);line-height:1.8;font-size:14.5px;margin-bottom:14px;">Al terminar esta unidad vas a poder mantener una conversación extremadamente simple con un ruso: presentarte, saludar, despedirte, decir de dónde sos y qué idiomas hablás.</p>
      <ul style="color:var(--sub);font-size:14px;line-height:2;padding-left:18px;">
        <li>10 módulos, cada uno con vocabulario, teoría breve y ejercicios.</li>
        <li>Mucho más output (escribir/hablar) que teoría.</li>
        <li>Al final: un proyecto de escritura libre, sin ayuda.</li>
      </ul>
    </div>
    <div class="card sb">
      <div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">Gramática de esta unidad</div>
      <ul style="color:var(--sub);font-size:14px;line-height:2;padding-left:18px;">
        <li>Pronombres personales: Я, Ты, Он, Она, Мы, Вы, Они.</li>
        <li>El ruso no usa un verbo "ser" explícito en presente: «Я Иван» ya es «Yo soy Iván».</li>
        <li>Diferencia entre «ты» (informal) y «вы» (formal/plural).</li>
        <li>Todavía no se enseñan casos gramaticales — eso empieza en unidades posteriores.</li>
      </ul>
    </div>
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div><div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;">Tiempo estimado</div>
      <p style="color:var(--sub);font-size:13.5px;">25 a 35 horas repartidas en 10 módulos.</p></div>
      <button class="btn pr" id="goModBtn">Ir a los módulos →</button>
    </div>`;
  document.getElementById('goModBtn').addEventListener('click',()=>navTo(1));
}

// ── MÓDULOS (grid + detalle) ─────────────────────
function renderModulos(el){
  el.innerHTML='<div id="mod2Wrap"></div>';
  mod2View='grid';
  renderMod2();
}
function renderMod2(){
  const wrap=document.getElementById('mod2Wrap');
  if(!wrap)return;
  wrap.innerHTML='';
  if(mod2View==='grid')mod2Grid(wrap);
  else if(mod2View==='detail')mod2Detail(wrap);
}
function mod2Grid(wrap){
  const hdr=document.createElement('div');hdr.className='sh';
  hdr.innerHTML=`<span class="shi">💬</span><div><h2>Los 10 módulos</h2><div class="shs">${mod2Dominated()} de 8 módulos con vocabulario dominados</div></div>`;
  wrap.appendChild(hdr);
  const grid=document.createElement('div');grid.className='ugrid';
  MODULES2.forEach(m=>{
    const st=MOD2_PROG[m.id]||0;
    const d=document.createElement('div');d.className='uc';
    d.innerHTML=`<div class="un">${String(m.id).padStart(2,'0')}</div>
      <div class="ut">${m.icon} ${m.title}</div>
      <div class="ud">${m.objective}</div>
      <div class="stbs"><span class="stb s${st}">${st===2?'Dominado':st===1?'En progreso':'Nuevo'}</span>${m.vocab.length?`<span class="stb">${m.vocab.length} palabras</span>`:''}</div>`;
    d.addEventListener('click',()=>{mod2Selected=m.id;mod2View='detail';renderMod2();});
    grid.appendChild(d);
  });
  wrap.appendChild(grid);
}
function mod2Detail(wrap){
  const m=MODULES2.find(x=>x.id===mod2Selected);
  if(!m){mod2View='grid';return mod2Grid(wrap);}
  const back=document.createElement('button');back.className='abk';back.innerHTML='← Volver a los módulos';
  back.addEventListener('click',()=>{mod2View='grid';renderMod2();});
  wrap.appendChild(back);

  const dh=document.createElement('div');dh.className='dh2';
  dh.innerHTML=`<div class="di"><h3>${m.icon} Módulo ${m.id} — ${m.title}</h3><span class="pch">${m.objective}</span></div>`;
  wrap.appendChild(dh);

  const theory=document.createElement('div');theory.className='card sb';
  theory.innerHTML=`<div class="dbl" style="color:var(--gold);">Teoría</div><p>${m.theory}</p>`;
  wrap.appendChild(theory);

  if(m.vocab.length){
    const vh=document.createElement('div');vh.className='sh';
    vh.innerHTML=`<span class="shi">📝</span><div><h2>Vocabulario</h2><div class="shs">${m.vocab.length} palabras y frases · tocá ▶ para escuchar</div></div>`;
    wrap.appendChild(vh);
    m.vocab.forEach(w=>{
      const card=document.createElement('div');card.className='wcard';
      const ru=document.createElement('div');ru.className='wru';ru.textContent=w.ru;
      const info=document.createElement('div');info.className='wi';
      info.innerHTML=`<div class="wtr">[${w.tr}]</div><div class="wes">${w.es}</div>${w.note?`<div class="wtr">${w.note}</div>`:''}`;
      const pb2=document.createElement('button');pb2.className='psm';pb2.textContent='▶';
      pb2.addEventListener('click',()=>speak(w.ru));
      card.appendChild(ru);card.appendChild(info);card.appendChild(pb2);
      wrap.appendChild(card);
    });
  }

  if(m.examples&&m.examples.length){
    const eh=document.createElement('div');eh.className='sh';
    eh.innerHTML=`<span class="shi">💬</span><div><h2>Diálogo de ejemplo</h2></div>`;
    wrap.appendChild(eh);
    m.examples.forEach(d=>{
      const card=document.createElement('div');card.className='card sb';
      d.lines.forEach(([tag,ru,tr,es])=>{
        const line=document.createElement('div');line.className='dll';
        const t=document.createElement('div');t.className='dlt';t.textContent=tag;
        const b=document.createElement('div');b.className='dlb';
        const ruDiv=document.createElement('div');ruDiv.className='dlr';ruDiv.textContent=ru;
        const pb2=document.createElement('button');pb2.className='psm';pb2.textContent='▶';pb2.style.marginLeft='6px';
        pb2.addEventListener('click',()=>speak(ru));
        ruDiv.appendChild(pb2);
        b.innerHTML=`<div class="dltr">[${tr}]</div><div class="dles">${es}</div>`;
        b.prepend(ruDiv);
        line.appendChild(t);line.appendChild(b);card.appendChild(line);
      });
      wrap.appendChild(card);
    });
  }

  if(m.vocab.length){
    const pbtn=document.createElement('button');pbtn.className='btn pr';pbtn.style.marginTop='6px';
    pbtn.textContent='Practicar este módulo';
    pbtn.addEventListener('click',()=>mod2Practice(wrap,m));
    wrap.appendChild(pbtn);
    const area=document.createElement('div');area.id='mod2PracArea';area.style.marginTop='14px';
    wrap.appendChild(area);
  } else if(m.id===9){
    renderDialogos2(wrap);
  } else if(m.id===10){
    const proj=document.createElement('div');proj.className='card sb';proj.style.marginTop='6px';
    proj.innerHTML=`<div class="dbl" style="color:var(--gold);">Tu conversación</div>
      <p style="margin-bottom:10px;">Escribí, sin ayuda, una conversación breve que incluya: presentarte, decir de dónde sos, qué idiomas hablás, preguntar el nombre del otro y despedirte.</p>
      <textarea class="notein" id="proj10" placeholder="A: Привет!..."></textarea>
      <button class="btn pr" id="saveProj10" style="margin-top:10px;">Guardar en mi cuaderno</button>`;
    wrap.appendChild(proj);
    document.getElementById('saveProj10').addEventListener('click',()=>{
      const v=document.getElementById('proj10').value.trim();
      if(!v){toast('Escribí algo primero.');return;}
      azAddNote(v, 'unit-2'); addXP();
      toast('¡Guardado en tu cuaderno!');
    });
  }
}
function mod2Practice(wrap,m){
  const area=document.getElementById('mod2PracArea');
  area.innerHTML='';
  const localWords=m.vocab.map((w,wi)=>({id:m.id+'_'+wi,ru:w.ru,tr:w.tr,es:w.es,moduleId:m.id}));
  runSession2(area,['ru_to_es','es_to_ru','write_ru_es','listen_choose'],Math.min(10,localWords.length*2),null,localWords,(correct,total)=>{
    const pct=Math.round(correct/total*100);
    MOD2_PROG[m.id]=pct>=80?2:pct>=40?1:(MOD2_PROG[m.id]||0);
    saveMod2();
  });
}

// ── PALABRAS (todas) ──────────────────────────────
function renderPalabras2(el){
  const words=words2();
  const hdr=document.createElement('div');hdr.className='sh';
  hdr.innerHTML=`<span class="shi">📝</span><div><h2>Todo el vocabulario</h2><div class="shs">${words.length} palabras y frases de la Unidad 2</div></div>`;
  el.appendChild(hdr);
  words.forEach(w=>{
    const isFav=NB.favs.includes('u2_'+w.id);
    const card=document.createElement('div');card.className='wcard';
    const ru=document.createElement('div');ru.className='wru';ru.style.minWidth='0';ru.style.maxWidth='210px';ru.textContent=w.ru;
    const info=document.createElement('div');info.className='wi';
    info.innerHTML=`<div class="wtr">[${w.tr}]</div><div class="wes">${w.es}</div>`;
    const pb2=document.createElement('button');pb2.className='psm';pb2.textContent='▶';
    pb2.addEventListener('click',()=>speak(w.ru));
    const fb=document.createElement('button');fb.className='wfav';fb.textContent='★';
    fb.style.color=isFav?'var(--gold)':'var(--muted)';
    fb.addEventListener('click',()=>{
      const key='u2_'+w.id;const i=NB.favs.indexOf(key);
      if(i>=0)NB.favs.splice(i,1);else NB.favs.push(key);
      saveNB();fb.style.color=NB.favs.includes(key)?'var(--gold)':'var(--muted)';
    });
    card.appendChild(ru);card.appendChild(info);card.appendChild(pb2);card.appendChild(fb);
    el.appendChild(card);
  });
}

// ── DIÁLOGOS ──────────────────────────────────────
function renderDialogos2(el){
  const hdr=document.createElement('div');hdr.className='sh';
  hdr.innerHTML=`<span class="shi">🗨️</span><div><h2>Conversaciones reales</h2><div class="shs">Módulo 9 · leé, escuchá y practicá diálogos completos</div></div>`;
  el.appendChild(hdr);
  DIALOGUES2.forEach(d=>{
    const card=document.createElement('div');card.className='card sb';
    const title=document.createElement('div');title.style.cssText='font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;';
    title.textContent=d.title;card.appendChild(title);
    d.lines.forEach(([tag,ru,tr,es])=>{
      const line=document.createElement('div');line.className='dll';
      const t=document.createElement('div');t.className='dlt';t.textContent=tag;
      const b=document.createElement('div');b.className='dlb';
      const ruDiv=document.createElement('div');ruDiv.className='dlr';ruDiv.textContent=ru;
      const pb2=document.createElement('button');pb2.className='psm';pb2.textContent='▶';pb2.style.marginLeft='6px';
      pb2.addEventListener('click',()=>speak(ru));
      ruDiv.appendChild(pb2);
      b.innerHTML=`<div class="dltr">[${tr}]</div><div class="dles">${es}</div>`;
      b.prepend(ruDiv);
      line.appendChild(t);line.appendChild(b);card.appendChild(line);
    });
    el.appendChild(card);
  });
  const shell=document.createElement('div');el.appendChild(shell);
  const dh=document.createElement('div');dh.className='sh';dh.style.marginTop='8px';
  dh.innerHTML=`<span class="shi">🧩</span><div><h2>Completar diálogos</h2><div class="shs">Elegí la línea que sigue</div></div>`;
  el.appendChild(dh);
  const shell2=document.createElement('div');el.appendChild(shell2);
  runSession2(shell2,['dialogue_complete'],6);
}

// ── EXERCISE ENGINE (Unidad 2) ───────────────────
function genEx2(kind,pool){
  const words=pool||words2();
  switch(kind){
    case 'ru_to_es':{const w=rnd(words),ops=smpl(words.filter(x=>x.id!==w.id),3).map(x=>x.es);ops.push(w.es);return{kind,prompt:'¿Qué significa esta frase?',cy:w.ru,options:shuf(ops),answer:w.es,explain:`"${w.ru}" [${w.tr}] significa "${w.es}".`};}
    case 'es_to_ru':{const w=rnd(words),ops=smpl(words.filter(x=>x.id!==w.id),3).map(x=>x.ru);ops.push(w.ru);return{kind,prompt:`¿Cómo se dice "${w.es}" en ruso?`,options:shuf(ops),answer:w.ru,explain:`"${w.es}" se dice "${w.ru}" [${w.tr}].`};}
    case 'write_ru_es':{const w=rnd(words);return{kind,prompt:'Traducí al español:',cy:w.ru,inputAnswer:w.es,explain:`"${w.ru}" [${w.tr}] significa "${w.es}".`};}
    case 'write_es_ru':{const w=rnd(words);return{kind,prompt:'Escribí en ruso (cirílico):',promptWord:w.es,inputAnswer:w.ru,explain:`"${w.es}" se escribe "${w.ru}" [${w.tr}].`};}
    case 'order_words':{const w=rnd(words.filter(x=>x.ru.includes(' ')));if(!w)return genEx2('write_ru_es',words);const tiles=w.ru.split(' ');return{kind,prompt:`Ordená las palabras → "${w.es}":`,tiles:shuf(tiles),answer:w.ru,joiner:' ',explain:`La frase es "${w.ru}" [${w.tr}].`};}
    case 'listen_choose':{const w=rnd(words),ops=smpl(words.filter(x=>x.id!==w.id),3).map(x=>x.ru);ops.push(w.ru);return{kind,prompt:'Escuchá y elegí la frase:',audio:w.ru,options:shuf(ops),answer:w.ru,explain:`Escuchaste "${w.ru}" [${w.tr}] — ${w.es}.`};}
    case 'listen_write':{const w=rnd(words);return{kind,prompt:'Escuchá y escribí en ruso:',audio:w.ru,inputAnswer:w.ru,explain:`La frase era "${w.ru}" [${w.tr}] — ${w.es}.`};}
    case 'true_false':{const w=rnd(words);const it=Math.random()>.5;const wrongEs=rnd(words.filter(x=>x.id!==w.id)).es;return{kind,prompt:`¿"${w.ru}" significa "${it?w.es:wrongEs}"?`,options:['Verdadero','Falso'],answer:it?'Verdadero':'Falso',explain:`"${w.ru}" [${w.tr}] significa "${w.es}".`};}
    case 'dialogue_complete':{const d=rnd(DIALOGUES2.filter(x=>x.lines.length>=2));const i=1+Math.floor(Math.random()*(d.lines.length-1));const correct=d.lines[i][1];const others=DIALOGUES2.flatMap(x=>x.lines).map(l=>l[1]).filter(l=>l!==correct);const ops=smpl(others,3);ops.push(correct);return{kind,prompt:`Diálogo «${d.title}» — ¿qué dice a continuación?`,cy:d.lines[i-1][1]+'  →  …',options:shuf(ops),answer:correct,explain:`La respuesta natural es "${correct}" [${d.lines[i][2]}] — ${d.lines[i][3]}.`};}
    default: return genEx2('ru_to_es',words);
  }
}
function kindLbl2(k){return({'ru_to_es':'Ruso→Español','es_to_ru':'Español→Ruso','write_ru_es':'Traducción RU→ES','write_es_ru':'Traducción ES→RU','order_words':'Ordenar palabras','listen_choose':'Escuchar y elegir','listen_write':'Dictado','true_false':'Verdadero/Falso','dialogue_complete':'Completar diálogo'})[k]||k;}

function runSession2(container,kinds,count,onFinishOverride,poolOverride,onDoneExtra){
  let i=0,correct=0;const wrongItems=[];
  const t0=Date.now();
  const queue=Array.from({length:count},()=>genEx2(rnd(kinds),poolOverride));
  function finish(){
    { const u=azUnit(2); u.timeSec=(u.timeSec||0)+Math.round((Date.now()-t0)/1000); azSaveProgress(); }
    LAST_WRONG2=wrongItems;
    if(onDoneExtra)onDoneExtra(correct,queue.length);
    if(onFinishOverride)return onFinishOverride(correct,queue.length);
    container.innerHTML=`<div class="excard es2"><div class="ey">Sesión completa</div><div class="scr">${correct}/${queue.length}</div><p style="color:var(--muted);margin-top:6px;">${Math.round(correct/queue.length*100)}% de aciertos</p></div>`;
    const btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;';
    const rb=document.createElement('button');rb.className='btn pr';rb.textContent='Otra ronda';
    rb.addEventListener('click',()=>{container.innerHTML='';runSession2(container,kinds,count,onFinishOverride,poolOverride,onDoneExtra);});
    btnRow.appendChild(rb);
    if(wrongItems.length){
      const revBtn=document.createElement('button');revBtn.className='btn';revBtn.textContent=`Repasar lo que costó (${wrongItems.length})`;
      revBtn.addEventListener('click',()=>{
        container.innerHTML='';
        runSession2(container,kinds,wrongItems.length,onFinishOverride,wrongItems,onDoneExtra);
      });
      btnRow.appendChild(revBtn);
      const list=document.createElement('div');list.className='rl';
      list.innerHTML=`<p style="color:var(--text);margin-bottom:7px;font-weight:600;">Hoy te costó:</p><ul>${wrongItems.map(w=>`<li>${w.ru} — ${w.es}</li>`).join('')}</ul>`;
      container.querySelector('.excard').appendChild(list);
    }
    container.querySelector('.excard').appendChild(btnRow);
  }
  function step(){
    if(i>=queue.length)return finish();
    const ex=queue[i];
    const wrap=document.createElement('div');wrap.style.maxWidth='600px';
    const pbar=document.createElement('div');pbar.className='epb';pbar.innerHTML=`<div style="width:${Math.round(i/queue.length*100)}%"></div>`;
    const card=document.createElement('div');card.className='excard';
    card.innerHTML=`<div class="exkind">${kindLbl2(ex.kind)} · ${i+1}/${queue.length}</div>
      <div class="exq">${ex.prompt}${ex.cy?`<span class="excy">${ex.cy}</span>`:''}${ex.promptWord?`<div style="font-size:22px;color:var(--gold);font-weight:600;margin:8px 0;">${ex.promptWord}</div>`:''}</div>
      <div id="exBody2"></div><div class="fb" id="exFB2"></div>
      <div class="exac"><button class="btn gh" id="exSkip2">Saltar</button><button class="btn pr" id="exCheck2" style="display:none;">Comprobar</button><button class="btn pr" id="exNext2" style="display:none;">Siguiente →</button></div>`;
    wrap.appendChild(pbar);wrap.appendChild(card);
    container.innerHTML='';container.appendChild(wrap);
    buildExBody(ex);
    document.getElementById('exSkip2').addEventListener('click',()=>{i++;container.innerHTML='';step();});
    document.getElementById('exNext2').addEventListener('click',()=>{i++;container.innerHTML='';step();});
  }
  function buildExBody(ex){
    const body=document.getElementById('exBody2');
    if(ex.audio){
      const ab=document.createElement('button');ab.className='btn';ab.textContent='▶ Escuchar';
      ab.addEventListener('click',()=>speak(ex.audio));body.appendChild(ab);
      body.appendChild(document.createElement('br'));
      setTimeout(()=>speak(ex.audio),300);
    }
    if(ex.options){
      const g=document.createElement('div');g.className='og';
      ex.options.forEach(opt=>{
        const b=document.createElement('button');b.className='oo';b.textContent=opt;
        b.addEventListener('click',()=>submitEx(ex,opt,b,g));
        g.appendChild(b);
      });
      body.appendChild(g);
    } else if(ex.tiles){
      let chosen=[];
      const poolBtns=[];
      const drop=document.createElement('div');drop.className='drop';
      const poolEl=document.createElement('div');poolEl.className='pool';
      function renderDrop(){
        drop.innerHTML='';
        chosen.forEach((idx,pos)=>{
          const c=document.createElement('button');c.className='tl';c.textContent=ex.tiles[idx];
          c.title='Tocá para sacarla';
          c.addEventListener('click',()=>{
            chosen.splice(pos,1);
            poolBtns[idx].disabled=false;poolBtns[idx].style.opacity='1';
            renderDrop();
          });
          drop.appendChild(c);
        });
      }
      ex.tiles.forEach((ch,idx)=>{
        const t=document.createElement('button');t.className='tl';t.textContent=ch;
        t.addEventListener('click',()=>{
          if(t.disabled)return;
          t.disabled=true;t.style.opacity='.2';
          chosen.push(idx);
          renderDrop();
        });
        poolBtns.push(t);
        poolEl.appendChild(t);
      });
      body.appendChild(drop);body.appendChild(poolEl);
      const ck=document.getElementById('exCheck2');ck.style.display='inline-flex';
      ck.addEventListener('click',()=>submitEx(ex,chosen.map(idx=>ex.tiles[idx]).join(ex.joiner||''),null,null));
    } else if(ex.inputAnswer!==undefined){
      const inp=document.createElement('input');inp.className='ti';inp.placeholder='Escribí tu respuesta…';
      body.appendChild(inp);inp.focus();
      const ck=document.getElementById('exCheck2');ck.style.display='inline-flex';
      const go=()=>submitEx(ex,inp.value,inp,null);
      ck.addEventListener('click',go);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    }
  }
  function submitEx(ex,given,node,grid){
    const ans=ex.answer!==undefined?ex.answer:ex.inputAnswer;
    const isFreeform=!!node||!!(ex.tiles);
    let score=norm(given)===norm(ans)?1:0;
    if(isFreeform&&score!==1)score=scoreAnswer(given,ans);
    const ok=score===1,partial=score===0.5;
    correct+=score;
    addXP();
    if(score<1){wrongItems.push({ru:ex.cy||ans,es:ex.explain});}
    if(grid)grid.querySelectorAll('.oo').forEach(o=>{if(o.textContent===ans)o.classList.add('co');else if(o.textContent===given&&!ok)o.classList.add('wr2');o.disabled=true;});
    if(node&&node.tagName==='INPUT'){node.classList.add(ok?'co':partial?'pc':'wr2');node.disabled=true;}
    document.querySelectorAll('#exBody2 .oo,#exBody2 .tl').forEach(x=>x.disabled=true);
    document.getElementById('exCheck2').style.display='none';
    document.getElementById('exSkip2').style.display='none';
    document.getElementById('exNext2').style.display='inline-flex';
    const fb=document.getElementById('exFB2');
    fb.className='fb show '+(ok?'ok':partial?'partial':'bad');
    fb.innerHTML=(ok?'<b>✓ Correcto.</b> ':partial?'<b>½ Parcialmente correcto.</b> ':'<b>✗ Incorrecto.</b> ')+ex.explain;
  }
  step();
}

function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuf(a){return[...a].sort(()=>Math.random()-.5);}
function smpl(a,n){return shuf(a).slice(0,n);}
function norm(s){return s.trim().toLowerCase().replace(/ё/g,'е').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zа-я0-9]/gi,'');}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function scoreAnswer(given,answer){
  const g=norm(given),a=norm(answer);
  if(!g)return 0;
  if(g===a)return 1;
  const rawWords=String(answer).split(/[\s\/]+/).map(w=>norm(w)).filter(Boolean);
  if(rawWords.length>1){
    const hit=rawWords.some(w=>w.length>1&&g.includes(w));
    if(hit)return 0.5;
  }
  const dist=levenshtein(g,a);
  const maxLen=Math.max(g.length,a.length);
  if(maxLen>0&&dist<=Math.max(1,Math.ceil(maxLen*0.34)))return 0.5;
  return 0;
}
