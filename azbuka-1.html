:root{
  --bg:#0F0F14;--bg2:#17171E;--bg3:#1E1E28;
  --card:#1A1A24;--border:#2A2A38;
  --gold:#C9A84C;--goldD:#C9A84C33;
  --text:#F0EEE8;--muted:#888080;--sub:#B8B0A8;
  --accent:#4B6FAB;--green:#4CAF82;--orange:#E2884A;--purple:#9B7FE8;
  --nav-h:64px;--r:14px;
  --sans:-apple-system,"Inter","Helvetica Neue",Arial,sans-serif;
  --serif:-apple-system,"Inter","Helvetica Neue",Arial,sans-serif;
}
body.light{
  --bg:#F7F5F0;--bg2:#EDEAE4;--bg3:#E2DED7;
  --card:#FFFFFF;--border:#D5D0C8;
  --text:#1A1812;--muted:#8A847A;--sub:#5A5450;
  --green:#2E7D55;--orange:#C85A1A;--purple:#6B4EC0;
}
body.light .u1tab{background:#FFFFFF;border-color:var(--border);color:#6B6459;}
body.light .u1tab:hover{border-color:var(--gold);color:var(--text);}
body.light .u1tab.cu{background:var(--gold);border-color:var(--gold);color:#1A1812;}
body.light .afb{background:#FFFFFF;color:#6B6459;}
body.light .afb.ac{background:var(--gold);color:#1A1812;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);transition:background .3s,color .3s;}
::selection{background:var(--goldD);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* OVERLAY + DRAWER */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
#overlay.show{opacity:1;pointer-events:all;}
#drawer{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:210;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
#drawer.open{transform:translateX(0);}
#drawer .dh{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
#toHomeBtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);font-size:14.5px;width:100%;text-align:left;}
#toHomeBtn:hover{border-color:var(--gold);color:var(--gold);}
#drawerUnits{flex:1;overflow-y:auto;padding:10px 8px;}
#drawerFoot{padding:12px 16px calc(var(--nav-h) + 12px);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
#themeBtnDrawer,#homeBtnDrawer{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);font-size:14.5px;width:100%;text-align:left;}
#themeBtnDrawer:hover,#homeBtnDrawer:hover{border-color:var(--gold);color:var(--gold);}
#indexBtnDrawer{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);font-size:14.5px;width:100%;text-align:left;margin-top:8px;}
#indexBtnDrawer:hover{border-color:var(--gold);color:var(--gold);}
.d-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px;}
.d-u{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:none;border:none;color:var(--sub);font-size:13.5px;text-align:left;width:100%;}
.d-u:hover:not(.lk){background:var(--bg3);color:var(--text);}
.d-u.ac{background:var(--bg3);color:var(--gold);font-weight:600;}
.d-u.lk{opacity:.38;cursor:default;}
.d-n{font-size:11px;color:var(--muted);min-width:18px;}

/* CONTENT */
#content{min-height:calc(100vh - var(--nav-h));padding-bottom:calc(var(--nav-h) + 8px);}
.view{display:none;animation:fi .22s ease;}
.view.active{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.inner{max-width:700px;margin:0 auto;padding:24px 16px 40px;}

/* BOTTOM NAV */
#bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:100;gap:6px;}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);padding:7px 12px;border-radius:10px;font-size:11.5px;min-width:60px;}
.nb .ni{font-size:21px;}
.nb:hover{background:var(--bg3);color:var(--text);}
.nb.ac{color:var(--gold);}
.nb:disabled{opacity:.22;cursor:default;}
.nb:disabled:hover{background:none;}
#navMid{flex:1;text-align:center;font-size:12.5px;color:var(--sub);line-height:1.3;}
#navMid b{display:block;color:var(--text);font-size:13.5px;}

/* GENERIC */
.ey{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);margin-bottom:7px;font-weight:600;}
h1.pt{font-family:var(--serif);font-size:28px;margin-bottom:6px;}
p.ps{color:var(--sub);font-size:14.5px;margin-bottom:20px;max-width:560px;line-height:1.7;}

function generateQuizQuestion(letter, allLetters) {
  const types = ["sound", "letter", "word"];
  const type = types[Math.floor(Math.random() * types.length)];
  if (type === "sound") {
    const wrong = allLetters.filter(l => l.id !== letter.id).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [letter, ...wrong].sort(() => Math.random() - 0.5);
    return {
      type: "sound",
      question: `¿Cómo se pronuncia la letra ${letter.upper}?`,
      hint: "Elige la pronunciación correcta",
      options: options.map(l => ({
        id: l.id,
        text: l.pronunciation,
        isCorrect: l.id === letter.id
      }))
    };
  }
  if (type === "letter") {
    const wrong = allLetters.filter(l => l.id !== letter.id).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [letter, ...wrong].sort(() => Math.random() - 0.5);
    return {
      type: "letter",
      question: `¿Qué letra representa el sonido "${letter.translit}"?`,
      hint: "Elige la letra correcta",
      options: options.map(l => ({
        id: l.id,
        text: l.upper,
        isCorrect: l.id === letter.id
      }))
    };
  }
  // word type
  const word = letter.words[Math.floor(Math.random() * letter.words.length)];
  const wrongLetters = allLetters.filter(l => l.id !== letter.id).sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [letter, ...wrongLetters].sort(() => Math.random() - 0.5);
  return {
    type: "word",
    question: `En la palabra "${word.cyrillic}" (${word.meaning}), ¿cuál es el sonido de la letra ${letter.upper}?`,
    hint: word.note,
    options: options.map(l => ({
      id: l.id,
      text: l.upper + " → " + l.pronunciation.split(",")[0].slice(0, 30),
      isCorrect: l.id === letter.id
    }))
  };
}

// ── TTS ──────────────────────────────────────────
let RU_VOICE=null;
let CURRENT_UTTER=null; // referencia persistente: Chrome puede "perder" el audio si el utterance se recolecta por el GC
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const voices=speechSynthesis.getVoices();
  RU_VOICE=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ru'))||null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=pickVoice;
  pickVoice();
}
function speak(txt){
  if(!('speechSynthesis' in window)){toast('Tu navegador no soporta audio de voz.');return;}
  if(!RU_VOICE)pickVoice(); // algunos navegadores recién cargan la lista de voces al primer uso
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='ru-RU';if(RU_VOICE)u.voice=RU_VOICE;u.rate=0.85;u.volume=1;
  u.onerror=()=>toast('No se pudo reproducir el audio.');
  CURRENT_UTTER=u; // evita que el navegador descarte el utterance antes de hablar
  // pequeño delay: en algunos navegadores, hablar justo después de cancel() no suena
  setTimeout(()=>speechSynthesis.speak(u),15);
}


// ── TOAST ────────────────────────────────────────
let _tt;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2200);
}

function toggleTheme(){
  document.body.classList.toggle('light');
  const isLight=document.body.classList.contains('light');
  ss('theme',isLight?'light':'dark');
  updateThemeBtn();
}
function updateThemeBtn(){
  const btn=document.getElementById('themeBtnDrawer');
  if(!btn)return;
  const isLight=document.body.classList.contains('light');
  btn.textContent=isLight?'☀ Modo oscuro':'☾ Modo claro';
}

  CURR_SEC=sec;
  if(push)history.pushState({sec},'','');
  renderU1();
  updateNav();
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('popstate',e=>{navTo(e.state?e.state.sec:0,false);});

function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function renderDrawer(){
  const el=document.getElementById('drawerUnits');
  el.innerHTML='<div class="d-lbl">Unidades del curso</div>';
  UNITS.forEach(u=>{
    const ac=u.id===1;
    const a=document.createElement('a');
    a.className='d-u'+(ac?' ac':'');
    a.href='azbuka-'+u.id+'.html';
    a.innerHTML=`<span class="d-n">${String(u.id).padStart(2,'0')}</span><span>${u.title}</span>`;
    el.appendChild(a);
  });
}
function updateNav(){
  renderDrawer();
  const mid=document.getElementById('navMid');
  const s=U1S[CURR_SEC];
  mid.innerHTML=`<b>${s.ic} ${s.lbl}</b><span>Unidad 1</span>`;
  renderU1Tabs();
}
document.getElementById('overlay').addEventListener('click',closeDrawer);
document.getElementById('menuBtn').addEventListener('click',openDrawer);
document.getElementById('themeBtnDrawer').addEventListener('click',toggleTheme);
document.getElementById('prevBtn').addEventListener('click',()=>{
  if(CURR_SEC===0)location.href='azbuka-index.html';
  else navTo(CURR_SEC-1);
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  if(CURR_SEC<U1S.length-1)navTo(CURR_SEC+1);
  else toast('¡Llegaste al final de la Unidad 1! 🎉');
});

function renderU1Tabs(){
  const el=document.getElementById('pips');
  if(!el)return;
  el.innerHTML='';
  U1S.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='u1tab'+(i===CURR_SEC?' cu':i<CURR_SEC?' dn':'');
    b.innerHTML=`<span>${s.ic}</span><span>${s.lbl}</span>`;
    b.addEventListener('click',()=>navTo(i));
    el.appendChild(b);
  });
}

function renderAlfabeto(el){
  el.innerHTML='<div id="alfaWrap"></div>';
  alfaView='grid';alfaFilter='all';alfaSearch='';
  renderAlfa();
}
function renderAlfa(){
  const wrap=document.getElementById('alfaWrap');
  if(!wrap)return;
  wrap.innerHTML='';
  if(alfaView==='grid')alfaGrid(wrap);
  else if(alfaView==='detail')alfaDetail(wrap);
  else if(alfaView==='quiz')alfaQuizView(wrap);
}

function alfaGrid(wrap){
  const dom=dominated();
  const lr=Object.values(ALFA_PROG).filter(v=>v===1).length;
  const pct=Math.round(dom/33*100);
  const filtered=ALPHABET.filter(l=>{
    if(alfaSearch&&!l.upper.includes(alfaSearch)&&!l.lower.includes(alfaSearch)&&!l.name.toLowerCase().includes(alfaSearch.toLowerCase())&&!l.pronunciation.toLowerCase().includes(alfaSearch.toLowerCase()))return false;
    if(alfaFilter==='new'&&(ALFA_PROG[l.id]||0)!==0)return false;
    if(alfaFilter==='lr'&&(ALFA_PROG[l.id]||0)!==1)return false;
    if(alfaFilter==='dm'&&(ALFA_PROG[l.id]||0)!==2)return false;
    return true;
  });

  const hdr=document.createElement('div');
  hdr.className='sh';

  const tb=document.createElement('div');tb.className='atb';
  const filters=document.createElement('div');filters.style.display='flex';filters.style.gap='6px';filters.style.flexWrap='wrap';

    card.appendChild(res);card.appendChild(nxt);

  wrap.appendChild(card);

// ── EXERCISE ENGINE ──────────────────────────────
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuf(a){return[...a].sort(()=>Math.random()-.5);}
function smpl(a,n){return shuf(a).slice(0,n);}
function norm(s){return s.trim().toLowerCase().replace(/ё/g,'е').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zа-я0-9]/gi,'');}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function scoreAnswer(given,answer){
  const g=norm(given),a=norm(answer);
  if(!g)return 0;
  if(g===a)return 1;
  const rawWords=String(answer).split(/[\s\/]+/).map(w=>norm(w)).filter(Boolean);
  if(rawWords.length>1){
    const hit=rawWords.some(w=>w.length>1&&g.includes(w));
    if(hit)return 0.5;
  }
  const dist=levenshtein(g,a);
  const maxLen=Math.max(g.length,a.length);
  if(maxLen>0&&dist<=Math.max(1,Math.ceil(maxLen*0.34)))return 0.5;
  return 0;
}

function genEx(kind){
  const words=allWords();
  switch(kind){
    case 'letter_name':{const l=rnd(ALPHABET),ops=smpl(ALPHABET.filter(x=>x.id!==l.id),3).map(x=>x.name);ops.push(l.name);return{kind,prompt:'¿Cómo se llama esta letra?',cy:l.upper+' '+l.lower,options:shuf(ops),answer:l.name,explain:`La letra ${l.upper}${l.lower} se llama "${l.name}" y suena /${l.translit}/. ${l.details.description}`};}
    case 'letter_sound':{const l=rnd(ALPHABET),ops=smpl(ALPHABET.filter(x=>x.id!==l.id),3).map(x=>x.pronunciation.split(',')[0].slice(0,32));ops.push(l.pronunciation.split(',')[0].slice(0,32));return{kind,prompt:'¿Cómo suena esta letra?',cy:l.upper+' '+l.lower,options:shuf(ops),answer:l.pronunciation.split(',')[0].slice(0,32),explain:l.pronunciation+'. '+l.details.similar};}
    case 'ru_to_es':{const w=rnd(words),ops=smpl(words.filter(x=>x.id!==w.id),3).map(x=>x.es);ops.push(w.es);return{kind,prompt:'¿Qué significa esta palabra?',cy:w.ru,options:shuf(ops),answer:w.es,explain:`"${w.ru}" [${w.tr}] significa "${w.es}".`};}
    case 'es_to_ru':{const w=rnd(words),ops=smpl(words.filter(x=>x.id!==w.id),3).map(x=>x.ru);ops.push(w.ru);return{kind,prompt:`¿Cómo se escribe "${w.es}" en cirílico?`,options:shuf(ops),answer:w.ru,explain:`"${w.es}" se escribe "${w.ru}" [${w.tr}].`};}
    case 'fill_letter':{const w=rnd(words);const cs=[...w.ru];const gi=Math.floor(Math.random()*cs.length);const ans=cs[gi];const msk=cs.map((c,i)=>i===gi?'_':c).join('');return{kind,prompt:`Completá la letra que falta (significa "${w.es}"):`,cy:msk,inputAnswer:ans,explain:`La palabra completa es "${w.ru}" [${w.tr}] — ${w.es}.`};}
    case 'order_letters':{const w=rnd(words);return{kind,prompt:`Ordená las letras → "${w.es}":`,tiles:shuf([...w.ru]),answer:w.ru,explain:`La palabra es "${w.ru}" [${w.tr}].`};}
    case 'write_ru_es':{const w=rnd(words);return{kind,prompt:'Traducí al español:',cy:w.ru,inputAnswer:w.es,explain:`"${w.ru}" [${w.tr}] significa "${w.es}".`};}
    case 'write_es_ru':{const w=rnd(words);return{kind,prompt:'Escribí en cirílico:',promptWord:w.es,inputAnswer:w.ru,explain:`"${w.es}" se escribe "${w.ru}" [${w.tr}].`};}
    case 'listen_choose':{const w=rnd(words),ops=smpl(words.filter(x=>x.id!==w.id),3).map(x=>x.ru);ops.push(w.ru);return{kind,prompt:'Escuchá y elegí la palabra:',audio:w.ru,options:shuf(ops),answer:w.ru,explain:`Escuchaste "${w.ru}" [${w.tr}] — ${w.es}.`};}
    case 'listen_write':{const w=rnd(words);return{kind,prompt:'Escuchá y escribí en cirílico:',audio:w.ru,inputAnswer:w.ru,explain:`La palabra era "${w.ru}" [${w.tr}] — ${w.es}.`};}
    case 'true_false':{const l=rnd(ALPHABET);const it=Math.random()>.5;const sn=it?l.name:rnd(ALPHABET.filter(x=>x.id!==l.id)).name;return{kind,prompt:`¿La letra ${l.upper}${l.lower} se llama "${sn}"?`,options:['Verdadero','Falso'],answer:it?'Verdadero':'Falso',explain:`La letra ${l.upper}${l.lower} se llama "${l.name}".`};}
    default: return genEx('ru_to_es');
  }
}
function kindLbl(k){return({'letter_name':'Letras','letter_sound':'Sonidos','ru_to_es':'Cirílico→Español','es_to_ru':'Español→Cirílico','fill_letter':'Completar','order_letters':'Ordenar','write_ru_es':'Traducción RU→ES','write_es_ru':'Traducción ES→RU','listen_choose':'Escuchar y elegir','listen_write':'Dictado','true_false':'Verdadero/Falso'})[k]||k;}

function runSession(container,kinds,count,onFinish){
  let i=0,correct=0;
  const t0=Date.now();
  const queue=Array.from({length:count},()=>genEx(rnd(kinds)));
  function step(){
    if(i>=queue.length){
      PROG.timeSec+=Math.round((Date.now()-t0)/1000);saveProg();
      if(onFinish)return onFinish(correct,queue.length);
      container.innerHTML=`<div class="excard es2"><div class="ey">Sesión completa</div><div class="scr">${correct}/${queue.length}</div><p style="color:var(--muted);margin-top:6px;">${Math.round(correct/queue.length*100)}% de aciertos</p></div>`;
      const rb=document.createElement('button');rb.className='btn pr';rb.textContent='Otra ronda';rb.style.marginTop='14px';
      rb.addEventListener('click',()=>{container.innerHTML='';runSession(container,kinds,count,onFinish);});
      container.querySelector('.excard').appendChild(rb);
      return;
    }
    const ex=queue[i];
    const wrap=document.createElement('div');wrap.style.maxWidth='600px';
    const pbar=document.createElement('div');pbar.className='epb';pbar.innerHTML=`<div style="width:${Math.round(i/queue.length*100)}%"></div>`;
    const card=document.createElement('div');card.className='excard';
    card.innerHTML=`<div class="exkind">${kindLbl(ex.kind)} · ${i+1}/${queue.length}</div>
      <div class="exq">${ex.prompt}${ex.cy?`<span class="excy">${ex.cy}</span>`:''}${ex.promptWord?`<div style="font-size:22px;color:var(--gold);font-weight:600;margin:8px 0;">${ex.promptWord}</div>`:''}</div>
      <div id="exBody"></div><div class="fb" id="exFB"></div>
      <div class="exac"><button class="btn gh" id="exSkip">Saltar</button><button class="btn pr" id="exCheck" style="display:none;">Comprobar</button><button class="btn pr" id="exNext" style="display:none;">Siguiente →</button></div>`;
    wrap.appendChild(pbar);wrap.appendChild(card);
    container.innerHTML='';container.appendChild(wrap);
    buildExBody(ex);
    document.getElementById('exSkip').addEventListener('click',()=>{i++;container.innerHTML='';step();});
    document.getElementById('exNext').addEventListener('click',()=>{i++;container.innerHTML='';step();});
  }
  function buildExBody(ex){
    const body=document.getElementById('exBody');
    if(ex.audio){
      const ab=document.createElement('button');ab.className='btn';ab.textContent='▶ Escuchar';
      ab.addEventListener('click',()=>speak(ex.audio));body.appendChild(ab);
      body.appendChild(document.createElement('br'));
      setTimeout(()=>speak(ex.audio),300);
    }
    if(ex.options){
      const g=document.createElement('div');g.className='og';
      ex.options.forEach(opt=>{
        const b=document.createElement('button');b.className='oo';b.textContent=opt;
        b.addEventListener('click',()=>submitEx(ex,opt,b,g));
        g.appendChild(b);
      });
      body.appendChild(g);
    } else if(ex.tiles){
      let chosen=[]; // array of indices into ex.tiles
      const poolBtns=[];
      const drop=document.createElement('div');drop.className='drop';
      const pool=document.createElement('div');pool.className='pool';
      function renderDrop(){
        drop.innerHTML='';
        chosen.forEach((idx,pos)=>{
          const c=document.createElement('button');c.className='tl';c.textContent=ex.tiles[idx];
          c.title='Tocá para sacarla';
          c.addEventListener('click',()=>{
            chosen.splice(pos,1);
            poolBtns[idx].disabled=false;poolBtns[idx].style.opacity='1';
            renderDrop();
          });
          drop.appendChild(c);
        });
      }
      ex.tiles.forEach((ch,idx)=>{
        const t=document.createElement('button');t.className='tl';t.textContent=ch;
        t.addEventListener('click',()=>{
          if(t.disabled)return;
          t.disabled=true;t.style.opacity='.2';
          chosen.push(idx);
          renderDrop();
        });
        poolBtns.push(t);
        pool.appendChild(t);
      });
      body.appendChild(drop);body.appendChild(pool);
      const ck=document.getElementById('exCheck');ck.style.display='inline-flex';
      ck.addEventListener('click',()=>submitEx(ex,chosen.map(idx=>ex.tiles[idx]).join(''),null,null));
    } else if(ex.inputAnswer!==undefined){
      const inp=document.createElement('input');inp.className='ti';inp.placeholder='Escribí tu respuesta…';
      body.appendChild(inp);inp.focus();
      const ck=document.getElementById('exCheck');ck.style.display='inline-flex';
      const go=()=>submitEx(ex,inp.value,inp,null);
      ck.addEventListener('click',go);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    }
  }
  function submitEx(ex,given,node,grid){
    const ans=ex.answer!==undefined?ex.answer:ex.inputAnswer;
    const isFreeform=!!node||!!(ex.tiles);
    let score=norm(given)===norm(ans)?1:0;
    if(isFreeform&&score!==1)score=scoreAnswer(given,ans);
    const ok=score===1,partial=score===0.5;
    correct+=score;PROG.exDone++;
    if(score===1)addXP(2);else if(partial)addXP(1);else saveProg();
    if(grid)grid.querySelectorAll('.oo').forEach(o=>{if(o.textContent===ans)o.classList.add('co');else if(o.textContent===given&&!ok)o.classList.add('wr2');o.disabled=true;});
    if(node&&node.tagName==='INPUT'){node.classList.add(ok?'co':partial?'pc':'wr2');node.disabled=true;}
    document.querySelectorAll('#exBody .oo,#exBody .tl').forEach(x=>x.disabled=true);
    document.getElementById('exCheck').style.display='none';
    document.getElementById('exSkip').style.display='none';
    document.getElementById('exNext').style.display='inline-flex';
    const fb=document.getElementById('exFB');
    fb.className='fb show '+(ok?'ok':partial?'partial':'bad');
    fb.innerHTML=(ok?'<b>✓ Correcto.</b> ':partial?'<b>½ Parcialmente correcto.</b> ':'<b>✗ Incorrecto.</b> ')+ex.explain;
  }
  step();
}

// ── DICTADO ──────────────────────────────────────
function renderDictado(el){
  const hdr=document.createElement('div');hdr.className='sh';
  hdr.innerHTML=`<span class="shi">🎧</span><div><h2>Dictado</h2><div class="shs">Escuchá y escribí en cirílico</div></div>`;
  el.appendChild(hdr);
  const shell=document.createElement('div');el.appendChild(shell);
  runSession(shell,['listen_write','listen_choose'],8);
}

// ── EJERCICIOS ───────────────────────────────────
function renderEjercicios(el){
  const hdr=document.createElement('div');hdr.className='sh';
  hdr.innerHTML=`<span class="shi">⚡</span><div><h2>Escritura activa</h2><div class="shs">Traducción, completar palabras y ordenar letras</div></div>`;
  el.appendChild(hdr);
  const shell=document.createElement('div');el.appendChild(shell);
  runSession(shell,['fill_letter','order_letters','write_ru_es','write_es_ru','listen_write'],12);
}

// ── EVALUACIÓN ───────────────────────────────────
function renderEvaluacion(el){
  const hdr=document.createElement('div');hdr.className='sh';
  hdr.innerHTML=`<span class="shi">🎯</span><div><h2>Evaluación</h2><div class="shs">Examen de la Unidad 1 — necesitás 80% para aprobar</div></div>`;
  el.appendChild(hdr);
  const intro=document.createElement('div');intro.className='card sb';
  intro.innerHTML=`<p style="color:var(--sub);font-size:14.5px;margin-bottom:16px;">22 preguntas combinando todos los tipos: letras, sonidos, traducción escrita, dictado, completar y ordenar.</p>`;
  const startBtn=document.createElement('button');startBtn.className='btn pr';startBtn.textContent='Empezar examen';
  const area=document.createElement('div');area.id='examArea';
  startBtn.addEventListener('click',()=>{
    intro.style.display='none';area.innerHTML='';
    const ALL=['ru_to_es','es_to_ru','fill_letter','order_letters','write_ru_es','write_es_ru','listen_choose','listen_write'];
    runSession(area,ALL,22,(correct,total)=>{
      const pct=Math.round(correct/total*100);addXP(pct>=80?30:10);
      area.innerHTML=`<div class="excard es2">
        <div class="ey">${pct>=80?'¡Aprobado!':'Seguí practicando'}</div>
        <div class="scr">${pct}%</div>
        <p style="color:var(--muted);margin-top:5px;">${correct} de ${total} respuestas correctas</p>
        ${pct>=80?`<p style="color:var(--green);margin-top:12px;">Dominás la Unidad 1.</p>`:
        `<div class="rl"><p style="color:var(--text);margin-bottom:7px;font-weight:600;">Antes de reintentar:</p><ul><li>Repasá las letras en la sección Alfabeto.</li><li>Practicá el dictado y la escritura activa.</li></ul></div>`}
        </div>`;
      const btns=document.createElement('div');btns.style.cssText='display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center;';
      const r=document.createElement('button');r.className='btn pr';r.textContent='Reintentar';
      r.addEventListener('click',()=>{area.innerHTML='';intro.style.display='';startBtn.textContent='Empezar examen';});
      const a=document.createElement('button');a.className='btn';a.textContent='Ir al alfabeto';
      a.addEventListener('click',()=>navTo(1));
      btns.appendChild(r);btns.appendChild(a);area.querySelector('.excard').appendChild(btns);
    });
  });
  intro.appendChild(startBtn);el.appendChild(intro);el.appendChild(area);
}


async function init(){
  const theme=await sg('theme','dark');
  if(theme==='light')document.body.classList.add('light');
  updateThemeBtn();
  PROG=await sg('prog',{xp:0,streak:0,lastDate:null,exDone:0,timeSec:0,studyDays:[]});
  ALFA_PROG=await sg('alfaProg',{});
  NB=await sg('notebook',{favs:[],notes:[]});
  history.replaceState({sec:0},'','');
  navTo(0,false);
}
init();
