<script src="core.js"></script>
<script src="data-alphabet.js"></script>
<script src="data-diccionario.js"></script>
<script src="data-verbos.js"></script>

<script src="data-azbuka3.js"></script>
<script>
/* ── Азбука App ── */
const React = { createElement: htmPreact.h, Fragment: function(p){ return p.children; } };
const { useState, useEffect, useCallback, useRef } = htmPreact;

// ─── DATA ────────────────────────────────────────────────────────────────────

// ALPHABET y generateQuizQuestion se cargan desde data-alphabet.js (compartido con azbuka-1.html)

// ─── AUDIO UTIL ─────────────────────────────────────────────────────────────
function speakText(text, lang = "ru-RU") {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang;
  utt.rate = 0.85;
  utt.pitch = 1;
  window.speechSynthesis.speak(utt);
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState("grid"); // grid | detail | practice | quiz
  const [selected, setSelected] = useState(null);
  const [showPronun, setShowPronun] = useState(true);
  const [showNames, setShowNames] = useState(true);
  const [showTranslit, setShowTranslit] = useState(true);
  const [darkMode, setDarkMode] = useState(true);
  const [search, setSearch] = useState("");
  const [progress, setProgress] = useState({}); // id -> 0|1|2
  const [quizState, setQuizState] = useState(null);
  const [quizScore, setQuizScore] = useState({
    correct: 0,
    total: 0
  });
  const [quizAnswer, setQuizAnswer] = useState(null);
  const [activeWord, setActiveWord] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const searchRef = useRef(null);

  // Progreso y tema compartidos con azbuka-1.html (Unidad 1, sección Alfabeto)
  // vía core.js + localStorage — mismo bucket az_progress.modules.alfabeto
  // porque ambos archivos usan el mismo data-alphabet.js. Esta página es
  // React y no llama a azInit() (el drawer lo controla React, no
  // azWireDrawer), así que el registro del buscador transversal se hace
  // acá a mano — azInit() en el resto de las páginas ya lo hace solo.
  useEffect(() => {
    (async () => {
      await azLoadProgress();
      setProgress(azModule('alfabeto').mastery || {});
      const t = await azGet('az_theme', 'dark');
      setDarkMode(t !== 'light');
      azRegisterAllKnownSearchIndexes();
    })();
  }, []);
  const saveProgress = newProg => {
    setProgress(newProg);
    azModule('alfabeto').mastery = newProg;
    azSaveProgress();
  };
  const setLetterStatus = (id, status) => {
    saveProgress({
      ...progress,
      [id]: status
    });
  };
  const dominated = Object.values(progress).filter(v => v === 2).length;
  const learning = Object.values(progress).filter(v => v === 1).length;
  const progressPct = Math.round(dominated / 33 * 100);
  const filteredLetters = ALPHABET.filter(l => l.upper.includes(search) || l.lower.includes(search) || l.name.toLowerCase().includes(search.toLowerCase()) || l.pronunciation.toLowerCase().includes(search.toLowerCase()));

  // Navigate between letters
  const goNext = () => {
    if (!selected) return;
    const idx = ALPHABET.findIndex(l => l.id === selected.id);
    if (idx < ALPHABET.length - 1) setSelected(ALPHABET[idx + 1]);
  };
  const goPrev = () => {
    if (!selected) return;
    const idx = ALPHABET.findIndex(l => l.id === selected.id);
    if (idx > 0) setSelected(ALPHABET[idx - 1]);
  };
  const startQuiz = letter => {
    const q = generateQuizQuestion(letter, ALPHABET);
    setQuizState({
      letter,
      question: q
    });
    setQuizAnswer(null);
    setQuizScore({
      correct: 0,
      total: 0
    });
    setView("quiz");
