:root{
  --bg:#0F0F14;--bg2:#17171E;--bg3:#1E1E28;
  --card:#1A1A24;--border:#2A2A38;
  --gold:#C9A84C;--goldD:#C9A84C33;
  --text:#F0EEE8;--muted:#888080;--sub:#B8B0A8;
  --accent:#4B6FAB;--green:#4CAF82;--orange:#E2884A;--purple:#9B7FE8;
  --nav-h:64px;--r:14px;
  --sans:-apple-system,"Inter","Helvetica Neue",Arial,sans-serif;
  --serif:-apple-system,"Inter","Helvetica Neue",Arial,sans-serif;
}
body.light{
  --bg:#F7F5F0;--bg2:#EDEAE4;--bg3:#E2DED7;
  --card:#FFFFFF;--border:#D5D0C8;
  --text:#1A1812;--muted:#8A847A;--sub:#5A5450;
  --green:#2E7D55;--orange:#C85A1A;--purple:#6B4EC0;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);transition:background .3s,color .3s;}
::selection{background:var(--goldD);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
#overlay.show{opacity:1;pointer-events:all;}
#drawer{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:210;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
#drawer.open{transform:translateX(0);}
#drawer .dh{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
#toHomeBtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);font-size:14.5px;width:100%;text-align:left;}
#toHomeBtn:hover{border-color:var(--gold);color:var(--gold);}
#drawerUnits{flex:1;overflow-y:auto;padding:10px 8px;}
#drawerFoot{padding:12px 16px calc(var(--nav-h) + 12px);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
#themeBtnDrawer,#homeBtnDrawer{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);font-size:14.5px;width:100%;text-align:left;}
#themeBtnDrawer:hover,#homeBtnDrawer:hover{border-color:var(--gold);color:var(--gold);}
.d-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px;}
.d-u{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:none;border:none;color:var(--sub);font-size:13.5px;text-align:left;width:100%;}
.d-u:hover:not(.lk){background:var(--bg3);color:var(--text);}
.d-u.ac{background:var(--bg3);color:var(--gold);font-weight:600;}
.d-u.lk{opacity:.38;cursor:default;}
.d-n{font-size:11px;color:var(--muted);min-width:18px;}

#content{min-height:calc(100vh - var(--nav-h));padding-bottom:calc(var(--nav-h) + 8px);}
.view{display:none;animation:fi .22s ease;}
.view.active{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.inner{max-width:700px;margin:0 auto;padding:24px 16px 40px;}

#bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:100;gap:6px;}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);padding:7px 12px;border-radius:10px;font-size:11.5px;min-width:60px;}
.nb .ni{font-size:21px;}
.nb:hover{background:var(--bg3);color:var(--text);}
.nb.ac{color:var(--gold);}
.nb:disabled{opacity:.22;cursor:default;}
.nb:disabled:hover{background:none;}
#navMid{flex:1;text-align:center;font-size:12.5px;color:var(--sub);line-height:1.3;}
#navMid b{display:block;color:var(--text);font-size:13.5px;}

.ey{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);margin-bottom:7px;font-weight:600;}
h1.pt{font-family:var(--serif);font-size:28px;margin-bottom:6px;}
p.ps{color:var(--sub);font-size:14.5px;margin-bottom:20px;max-width:560px;line-height:1.7;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;}
.sb{margin-bottom:26px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13.5px;transition:.15s;font-family:inherit;cursor:pointer;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.pr{background:var(--gold);border-color:var(--gold);color:#0F0F14;font-weight:700;}
.btn.pr:hover{filter:brightness(1.08);color:#0F0F14;}
.btn.gh{background:transparent;}
.btn:disabled{opacity:.3;cursor:default;}
.sr{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}

// ── GENERADOR DE EJERCICIOS ───────────────────────
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuf(a){return[...a].sort(()=>Math.random()-.5);}
function smpl(a,n){return shuf(a).slice(0,n);}
function norm(s){return s.trim().toLowerCase().replace(/ё/g,'е').normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
const REGULAR_NOUNS=NOUNS.filter(n=>!n.irregular);

function genEx3(kind){
  switch(kind){
    case 'noun_gender':{
      const n=rnd(NOUNS);
      const options=shuf(['Masculino','Femenino','Neutro']);
      return{kind,prompt:'¿Qué género tiene esta palabra?',cy:n.ru,options,answer:genderLabel(n.gender),explain:`"${n.ru}" (${n.es}) es ${genderLabel(n.gender).toLowerCase()}. ${n.note}`};
    }
    case 'noun_plural':{
      const n=rnd(REGULAR_NOUNS);
      const wrong=smpl(REGULAR_NOUNS.filter(x=>x.id!==n.id),3).map(x=>x.plural);
      return{kind,prompt:`¿Cuál es el plural de "${n.ru}" (${n.es})?`,options:shuf([n.plural,...wrong]),answer:n.plural,explain:`El plural de "${n.ru}" es "${n.plural}".`};
    }
    case 'plural_write':{
      const n=rnd(REGULAR_NOUNS);
      return{kind,prompt:`Escribí el plural de "${n.ru}" (${n.es}):`,inputAnswer:n.plural,explain:`El plural de "${n.ru}" es "${n.plural}".`};
    }
    case 'adj_agreement':{
      const a=rnd(ADJECTIVES),n=rnd(NOUNS);
      const correct=adjForm(a,n.gender);
      const others=[a.masc,a.fem,a.neut].filter(f=>f!==correct);
      return{kind,prompt:`"${n.ru}" (${n.es}) es ${genderLabel(n.gender).toLowerCase()}. Elegí la forma correcta de "${a.es}":`,options:shuf([correct,...others]),answer:correct,explain:`Como "${n.ru}" es ${genderLabel(n.gender).toLowerCase()}, el adjetivo toma la forma "${correct}". Frase: "Это ${correct} ${n.ru}."`};
    }
    case 'ru_to_es':{
      const n=rnd(NOUNS),wrong=smpl(NOUNS.filter(x=>x.id!==n.id),3).map(x=>x.es);
      return{kind,prompt:'¿Qué significa esta palabra?',cy:n.ru,options:shuf([n.es,...wrong]),answer:n.es,explain:`"${n.ru}" [${n.translit}] significa "${n.es}".`};
    }
    case 'es_to_ru':{
      const n=rnd(NOUNS),wrong=smpl(NOUNS.filter(x=>x.id!==n.id),3).map(x=>x.ru);
      return{kind,prompt:`¿Cómo se dice "${n.es}" en ruso?`,options:shuf([n.ru,...wrong]),answer:n.ru,explain:`"${n.es}" se dice "${n.ru}" [${n.translit}].`};
    }
    case 'fill_letter':{
      const n=rnd(NOUNS);const cs=[...n.ru];const gi=Math.floor(Math.random()*cs.length);const ans=cs[gi];
      const msk=cs.map((c,i)=>i===gi?'_':c).join('');
      return{kind,prompt:`Completá la letra que falta (significa "${n.es}"):`,cy:msk,inputAnswer:ans,explain:`La palabra completa es "${n.ru}" [${n.translit}] — ${n.es}.`};
    }
    case 'order_letters':{
      const n=rnd(NOUNS);
      return{kind,prompt:`Ordená las letras → "${n.es}":`,tiles:shuf([...n.ru]),answer:n.ru,explain:`La palabra es "${n.ru}" [${n.translit}].`};
    }
    case 'listen_choose':{
      const n=rnd(NOUNS),wrong=smpl(NOUNS.filter(x=>x.id!==n.id),3).map(x=>x.ru);
      return{kind,prompt:'Escuchá y elegí la palabra:',audio:n.ru,options:shuf([n.ru,...wrong]),answer:n.ru,explain:`Escuchaste "${n.ru}" [${n.translit}] — ${n.es}.`};
    }
    case 'listen_write':{
      const n=rnd(NOUNS);
      return{kind,prompt:'Escuchá y escribí en cirílico:',audio:n.ru,inputAnswer:n.ru,explain:`La palabra era "${n.ru}" [${n.translit}] — ${n.es}.`};
    }
    case 'true_false':{
      const n=rnd(NOUNS);const it=Math.random()>.5;
      const sg=it?genderLabel(n.gender):genderLabel(rnd(['m','f','n'].filter(g=>g!==n.gender)));
      return{kind,prompt:`¿"${n.ru}" (${n.es}) es ${sg.toLowerCase()}?`,options:['Verdadero','Falso'],answer:it?'Verdadero':'Falso',explain:`"${n.ru}" es ${genderLabel(n.gender).toLowerCase()}. ${n.note}`};
    }
    default: return genEx3('ru_to_es');
  }
}

let RU_VOICE=null;
let CURRENT_UTTER=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const voices=speechSynthesis.getVoices();
  RU_VOICE=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ru'))||null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=pickVoice;
  pickVoice();
}
function speak(txt){
  if(!('speechSynthesis' in window)){toast('Tu navegador no soporta audio de voz.');return;}
  if(!RU_VOICE)pickVoice();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='ru-RU';if(RU_VOICE)u.voice=RU_VOICE;u.rate=0.85;u.volume=1;
  u.onerror=()=>toast('No se pudo reproducir el audio.');
  CURRENT_UTTER=u;
  setTimeout(()=>speechSynthesis.speak(u),15);
}

// ── GÉNERO ───────────────────────────────────────
function renderGenero(el){
  el.innerHTML='<div id="genWrap"></div>';
  genView='grid';genFilter='all';
  renderGen();
}
function renderGen(){
  const wrap=document.getElementById('genWrap');
  if(!wrap)return;
  wrap.innerHTML='';
  if(genView==='grid')genGrid(wrap);
  else if(genView==='detail')genDetail(wrap);
  else if(genView==='quiz')genQuizView(wrap);
}
function genGrid(wrap){
  const dom=dominated();
  const lr=Object.values(NOUN_PROG).filter(v=>v===1).length;
  const pct=Math.round(dom/NOUNS.length*100);
  const filtered=NOUNS.filter(n=>{
    if(genFilter==='m')return n.gender==='m';
    if(genFilter==='f')return n.gender==='f';
    if(genFilter==='n')return n.gender==='n';
    if(genFilter==='exc')return n.exception;
    return true;
  });
  const hdr=document.createElement('div');hdr.className='sh';
  hdr.innerHTML=`<span class="shi">⚧</span><div><h2>Género de los sustantivos</h2><div class="shs">${dom}/${NOUNS.length} dominados · ${lr} aprendiendo · ${pct}%</div></div>`;
  wrap.appendChild(hdr);
  const tb=document.createElement('div');tb.className='atb';
  const filters=document.createElement('div');filters.style.display='flex';filters.style.gap='6px';filters.style.flexWrap='wrap';
  [['all','Todas'],['m','Masculino'],['f','Femenino'],['n','Neutro'],['exc','Excepciones']].forEach(([k,lbl])=>{
    const b=document.createElement('button');b.className='afb'+(genFilter===k?' ac':'');b.textContent=lbl;
    b.addEventListener('click',()=>{genFilter=k;renderGen();});
    filters.appendChild(b);
  });
  const quizBtn=document.createElement('button');quizBtn.className='btn pr';quizBtn.textContent='Practicar género →';
  quizBtn.addEventListener('click',()=>genStartQuiz());
  tb.appendChild(filters);tb.appendChild(quizBtn);
  wrap.appendChild(tb);
  if(filtered.length===0){wrap.innerHTML+='<div class="empty">Sin resultados para ese filtro.</div>';return;}
  const grid=document.createElement('div');grid.className='agrid';
  filtered.forEach(n=>{
    const st=NOUN_PROG[n.id]||0;
    const stCls=st===2?' dm':st===1?' lr':'';
    const stIc=st===2?`<span class="ast" style="color:var(--green)">●</span>`:st===1?`<span class="ast" style="color:var(--orange)">◑</span>`:'';
    const card=document.createElement('div');card.className='ac2'+stCls;
    card.innerHTML=`${stIc}<div class="au" style="font-size:16px;color:${genderColor(n.gender)};">${n.ru}</div><div class="ap" style="margin-top:6px;">${n.es}</div><div class="ap" style="color:${genderColor(n.gender)};font-weight:600;margin-top:3px;">${genderLabel(n.gender)}</div>`;
    card.addEventListener('click',()=>{genSelected=n;genView='detail';renderGen();});
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
}
function genDetail(wrap){
  const n=genSelected;
  if(!n){genView='grid';renderGen();return;}
  const idx=NOUNS.findIndex(x=>x.id===n.id);
  const st=NOUN_PROG[n.id]||0;

  const bk=document.createElement('button');bk.className='abk';bk.innerHTML='← Volver al género';
  bk.addEventListener('click',()=>{genView='grid';renderGen();});
  wrap.appendChild(bk);

  const hero=document.createElement('div');hero.className='dh2';
  const glyph=document.createElement('div');glyph.className='dg';
  glyph.innerHTML=`<div class="dbig" style="font-size:38px;color:${genderColor(n.gender)};">${n.ru}</div>`;
  const info=document.createElement('div');info.className='di';info.style.flex='1';
  info.innerHTML=`<h3>${n.es}</h3><span class="pch" style="border-color:${genderColor(n.gender)};color:${genderColor(n.gender)};background:${genderColor(n.gender)}22;">${genderLabel(n.gender)}</span><div style="font-size:13px;color:var(--sub);margin-bottom:10px;line-height:1.6;">[${n.translit}]</div>`;
  const navBtns=document.createElement('div');navBtns.style.cssText='display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;';
  const playBtn=document.createElement('button');playBtn.className='psm';playBtn.textContent='▶';
  playBtn.addEventListener('click',()=>speak(n.ru));
  const prevBtn2=document.createElement('button');prevBtn2.className='btn';prevBtn2.textContent='← Anterior';prevBtn2.style.fontSize='12px';
  prevBtn2.addEventListener('click',()=>{genSelected=NOUNS[(idx-1+NOUNS.length)%NOUNS.length];renderGen();});
  const nextBtn2=document.createElement('button');nextBtn2.className='btn';nextBtn2.textContent='Siguiente →';nextBtn2.style.fontSize='12px';
  nextBtn2.addEventListener('click',()=>{genSelected=NOUNS[(idx+1)%NOUNS.length];renderGen();});
  navBtns.appendChild(playBtn);navBtns.appendChild(prevBtn2);navBtns.appendChild(nextBtn2);
  info.appendChild(navBtns);
  const stbs=document.createElement('div');stbs.className='stbs';
  [['○ No estudiada',0,''],['◑ Aprendiendo',1,'s1'],['● Dominada',2,'s2']].forEach(([lbl,val,cls])=>{
    const b=document.createElement('button');b.className='stb'+(st===val?' '+cls:'');b.textContent=lbl;
    b.addEventListener('click',()=>{
      NOUN_PROG[n.id]=val;saveNoun();
      if(val===2)addXP(3);else if(val===1)addXP(1);
      renderGen();
    });
    stbs.appendChild(b);
  });
  info.appendChild(stbs);
  hero.appendChild(glyph);hero.appendChild(info);
  wrap.appendChild(hero);

  const dgrid=document.createElement('div');dgrid.className='dgrid';
  dgrid.innerHTML=`
    <div class="db"><div class="dbl" style="color:var(--gold);">Por qué es ${genderLabel(n.gender).toLowerCase()}</div><p>${n.note}</p></div>
    <div class="db"><div class="dbl" style="color:var(--green);">Plural</div><p><span class="wru" style="font-size:17px;">${n.plural}</span>${n.irregular?'<br><span style="color:var(--orange);font-size:11.5px;">Plural irregular — memorizalo tal cual.</span>':'<br><span style="color:var(--muted);font-size:11.5px;">Sigue el patrón regular de plural.</span>'}</p></div>`;
  wrap.appendChild(dgrid);

  const phrase=document.createElement('div');phrase.className='card';
  const adj=rnd(ADJECTIVES);
  const form=adjForm(adj,n.gender);
  const esArt=(n.gender==='f'?'una':'un');
  phrase.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">Ejemplo con adjetivo</div>
    <div class="wr"><div style="flex:1;"><div class="wru">Это ${form} ${n.ru}.</div><div class="wtr">/eto ${form.toLowerCase()} ${n.translit}/</div><div class="wes">Es ${esArt} ${n.es} ${adj.es}.</div></div></div>`;
  const pb2=phrase.querySelector('.wr');
  const playPhraseBtn=document.createElement('button');playPhraseBtn.className='psm';playPhraseBtn.textContent='▶';
  playPhraseBtn.addEventListener('click',()=>speak(`Это ${form} ${n.ru}`));
  pb2.appendChild(playPhraseBtn);
  wrap.appendChild(phrase);
}
function genStartQuiz(){
  genQuizQ=genEx3('noun_gender');
  genQuizAnswer=null;
  genView='quiz';
  renderGen();
}
function genQuizView(wrap){
  const q=genQuizQ;
  if(!q){genView='grid';renderGen();return;}
  const bk=document.createElement('button');bk.className='abk';bk.textContent='← Volver al género';
  bk.addEventListener('click',()=>{genView='grid';renderGen();});
  wrap.appendChild(bk);
  const score=document.createElement('div');score.style.cssText='display:flex;gap:10px;margin-bottom:12px;';
  score.innerHTML=`<div class="sc" style="padding:7px 12px;"><span style="font-size:12.5px;color:var(--muted)">Correctas: <b style="color:var(--text)">${genQuizC}</b></span></div><div class="sc" style="padding:7px 12px;"><span style="font-size:12.5px;color:var(--muted)">Total: <b style="color:var(--text)">${genQuizT}</b></span></div>`;
  wrap.appendChild(score);
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div style="text-align:center;margin-bottom:14px;"><div class="wru" style="font-size:32px;">${q.cy}</div></div><div class="qq">${q.question}</div>`;
  const opts=document.createElement('div');opts.className='qopts';
  const answered=genQuizAnswer!==null;
  q.options.forEach(o=>{
    const btn=document.createElement('button');btn.className='qo';btn.textContent=o;
    if(answered){
      if(o===q.answer)btn.classList.add('co');
      else if(o===genQuizAnswer&&o!==q.answer)btn.classList.add('wr2');
      btn.disabled=true;
    } else {
      btn.addEventListener('click',()=>{
        genQuizAnswer=o;genQuizT++;
        if(o===q.answer){genQuizC++;addXP(2);}
        renderGen();
      });
    }
    opts.appendChild(btn);
  });
  card.appendChild(opts);
  if(answered){
    const res=document.createElement('div');res.style.cssText='margin-top:14px;padding:11px;border-radius:10px;background:var(--bg2);font-size:13.5px;color:var(--sub);line-height:1.6;';
    res.textContent=q.explain;
    const nxt=document.createElement('button');nxt.className='btn pr';nxt.style.cssText='margin-top:10px;width:100%;';nxt.textContent='Siguiente →';
    nxt.addEventListener('click',()=>{genQuizQ=genEx3('noun_gender');genQuizAnswer=null;renderGen();});
    card.appendChild(res);card.appendChild(nxt);
  }
  wrap.appendChild(card);
}

  el.appendChild(hdr);
  ADJECTIVES.forEach(a=>{
    const card=document.createElement('div');card.className='card sb';
    const title=document.createElement('div');title.style.cssText='font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;';
    title.textContent=a.es;card.appendChild(title);
    const dgrid=document.createElement('div');dgrid.className='dgrid';
    [['Masculino',a.masc,'var(--accent)'],['Femenino',a.fem,'var(--purple)'],['Neutro',a.neut,'var(--gold)'],['Plural',a.plur,'var(--green)']].forEach(([lbl,form,col])=>{
      const db=document.createElement('div');db.className='db';
      db.innerHTML=`<div class="dbl" style="color:${col};">${lbl}</div><p style="font-family:var(--serif);font-size:17px;color:var(--text);">${form}</p>`;
      const pb2=document.createElement('button');pb2.className='psm';pb2.style.marginTop='6px';pb2.textContent='▶';
      pb2.addEventListener('click',()=>speak(form));
      db.appendChild(pb2);
      dgrid.appendChild(db);

    card.appendChild(dgrid);

  });

  const build=document.createElement('div');build.className='card sb';
  build.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;">Constructor de frases</div>`;
  const selRow=document.createElement('div');selRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;';
  const nounSel=document.createElement('select');nounSel.className='asr';nounSel.style.width='auto';
  NOUNS.forEach(n=>{const o=document.createElement('option');o.value=n.id;o.textContent=`${n.ru} (${n.es})`;nounSel.appendChild(o);});
  const adjSel=document.createElement('select');adjSel.className='asr';adjSel.style.width='auto';
  ADJECTIVES.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.es;adjSel.appendChild(o);});
  selRow.appendChild(nounSel);selRow.appendChild(adjSel);
  build.appendChild(selRow);
  const result=document.createElement('div');result.className='wr';
  build.appendChild(result);
  function updatePhrase(){
    const n=NOUNS.find(x=>x.id==nounSel.value);
    const a=ADJECTIVES.find(x=>x.id==adjSel.value);
    const form=adjForm(a,n.gender);
    const esArt=(n.gender==='f'?'una':'un');

    const pb2=document.createElement('button');pb2.className='psm';pb2.textContent='▶';
    pb2.addEventListener('click',()=>speak(`Это ${form} ${n.ru}`));
    result.appendChild(pb2);
  }
  nounSel.addEventListener('change',updatePhrase);
  adjSel.addEventListener('change',updatePhrase);

  el.appendChild(build);

  const practCard=document.createElement('div');practCard.className='card';
  const practBtn=document.createElement('button');practBtn.className='btn pr';practBtn.textContent='Practicar concordancia →';
  practCard.appendChild(practBtn);
  const shell=document.createElement('div');shell.style.marginTop='14px';
  practCard.appendChild(shell);
  practBtn.addEventListener('click',()=>{
    practBtn.style.display='none';

}

    const pb2=document.createElement('button');pb2.className='psm';pb2.textContent='▶';
    pb2.addEventListener('click',()=>speak(n.ru));
    const fb=document.createElement('button');fb.className='wfav';fb.textContent='★';
    fb.style.color=isFav?'var(--gold)':'var(--muted)';
    fb.addEventListener('click',()=>{
      const key='n_'+n.id;
      const i=NB.favs.indexOf(key);
      if(i>=0)NB.favs.splice(i,1);else NB.favs.push(key);
      saveNB();fb.style.color=NB.favs.includes(key)?'var(--gold)':'var(--muted)';
    });
    card.appendChild(ru);card.appendChild(info);card.appendChild(pb2);card.appendChild(fb);
    el.appendChild(card);
  });
}

// ── EXERCISE ENGINE ──────────────────────────────
function runSession(container,kinds,count,onFinish){
  let i=0,correct=0;
  const t0=Date.now();
  const queue=Array.from({length:count},()=>genEx3(rnd(kinds)));
  function step(){
    if(i>=queue.length){
      PROG.timeSec+=Math.round((Date.now()-t0)/1000);saveProg();
      if(onFinish)return onFinish(correct,queue.length);
      container.innerHTML=`<div class="excard es2"><div class="ey">Sesión completa</div><div class="scr">${correct}/${queue.length}</div><p style="color:var(--muted);margin-top:6px;">${Math.round(correct/queue.length*100)}% de aciertos</p></div>`;
      const rb=document.createElement('button');rb.className='btn pr';rb.textContent='Otra ronda';rb.style.marginTop='14px';
      rb.addEventListener('click',()=>{container.innerHTML='';runSession(container,kinds,count,onFinish);});
      container.querySelector('.excard').appendChild(rb);
      return;
    }
    const ex=queue[i];
    const wrap=document.createElement('div');wrap.style.maxWidth='600px';
    const pbar=document.createElement('div');pbar.className='epb';pbar.innerHTML=`<div style="width:${Math.round(i/queue.length*100)}%"></div>`;
    const card=document.createElement('div');card.className='excard';
    card.innerHTML=`<div class="exkind">${kindLbl3(ex.kind)} · ${i+1}/${queue.length}</div>
      <div class="exq">${ex.prompt}${ex.cy?`<span class="excy">${ex.cy}</span>`:''}</div>
      <div id="exBody"></div><div class="fb" id="exFB"></div>
      <div class="exac"><button class="btn gh" id="exSkip">Saltar</button><button class="btn pr" id="exCheck" style="display:none;">Comprobar</button><button class="btn pr" id="exNext" style="display:none;">Siguiente →</button></div>`;
    wrap.appendChild(pbar);wrap.appendChild(card);
    container.innerHTML='';container.appendChild(wrap);
    buildExBody(ex);
    document.getElementById('exSkip').addEventListener('click',()=>{i++;container.innerHTML='';step();});
    document.getElementById('exNext').addEventListener('click',()=>{i++;container.innerHTML='';step();});
  }
  function buildExBody(ex){
    const body=document.getElementById('exBody');
    if(ex.audio){
      const ab=document.createElement('button');ab.className='btn';ab.textContent='▶ Escuchar';
      ab.addEventListener('click',()=>speak(ex.audio));body.appendChild(ab);
      body.appendChild(document.createElement('br'));
      setTimeout(()=>speak(ex.audio),300);
    }
    if(ex.options){
      const g=document.createElement('div');g.className='og';
      ex.options.forEach(opt=>{
        const b=document.createElement('button');b.className='oo';b.textContent=opt;
        b.addEventListener('click',()=>submitEx(ex,opt,b,g));
        g.appendChild(b);
      });
      body.appendChild(g);
    } else if(ex.tiles){
      let chosen=[];
      const poolBtns=[];
      const drop=document.createElement('div');drop.className='drop';
      const pool=document.createElement('div');pool.className='pool';
      function renderDrop(){
        drop.innerHTML='';
        chosen.forEach((idx,pos)=>{
          const c=document.createElement('button');c.className='tl';c.textContent=ex.tiles[idx];
          c.title='Tocá para sacarla';
          c.addEventListener('click',()=>{
            chosen.splice(pos,1);
            poolBtns[idx].disabled=false;poolBtns[idx].style.opacity='1';
            renderDrop();
          });
          drop.appendChild(c);
        });
      }
      ex.tiles.forEach((ch,idx)=>{
        const t=document.createElement('button');t.className='tl';t.textContent=ch;
        t.addEventListener('click',()=>{
          if(t.disabled)return;
          t.disabled=true;t.style.opacity='.2';
          chosen.push(idx);
          renderDrop();
        });
        poolBtns.push(t);
        pool.appendChild(t);
      });
      body.appendChild(drop);body.appendChild(pool);
      const ck=document.getElementById('exCheck');ck.style.display='inline-flex';
      ck.addEventListener('click',()=>submitEx(ex,chosen.map(idx=>ex.tiles[idx]).join(''),null,null));
    } else if(ex.inputAnswer!==undefined){
      const inp=document.createElement('input');inp.className='ti';inp.placeholder='Escribí tu respuesta…';
      body.appendChild(inp);inp.focus();
      const ck=document.getElementById('exCheck');ck.style.display='inline-flex';
      const go=()=>submitEx(ex,inp.value,inp,null);
      ck.addEventListener('click',go);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    }
  }
  function submitEx(ex,given,node,grid){
    const ans=ex.answer!==undefined?ex.answer:ex.inputAnswer;
    const ok=norm(given)===norm(ans);
    correct+=ok?1:0;PROG.exDone++;
    if(ok)addXP(2);else saveProg();
    if(grid)grid.querySelectorAll('.oo').forEach(o=>{if(o.textContent===ans)o.classList.add('co');else if(o.textContent===given&&!ok)o.classList.add('wr2');o.disabled=true;});
    if(node&&node.tagName==='INPUT'){node.classList.add(ok?'co':'wr2');node.disabled=true;}
    document.querySelectorAll('#exBody .oo,#exBody .tl').forEach(x=>x.disabled=true);
    document.getElementById('exCheck').style.display='none';
    document.getElementById('exSkip').style.display='none';
    document.getElementById('exNext').style.display='inline-flex';
    const fb=document.getElementById('exFB');
    fb.className='fb show '+(ok?'ok':'bad');
    fb.innerHTML=(ok?'<b>✓ Correcto.</b> ':'<b>✗ Incorrecto.</b> ')+ex.explain;
  }
  step();
}

function renderEvaluacion(el){
  const hdr=document.createElement('div');hdr.className='sh';
  hdr.innerHTML=`<span class="shi">🎯</span><div><h2>Evaluación</h2><div class="shs">Examen de la Unidad 3 — necesitás 80% para aprobar</div></div>`;
  el.appendChild(hdr);
  const intro=document.createElement('div');intro.className='card sb';
  intro.innerHTML=`<p style="color:var(--sub);font-size:14.5px;margin-bottom:16px;">22 preguntas combinando género, plural, concordancia de adjetivos, traducción, dictado, completar y ordenar.</p>`;
  const startBtn=document.createElement('button');startBtn.className='btn pr';startBtn.textContent='Empezar examen';
  const area=document.createElement('div');area.id='examArea';
  startBtn.addEventListener('click',()=>{
    intro.style.display='none';area.innerHTML='';
    const ALL=['noun_gender','noun_plural','plural_write','adj_agreement','ru_to_es','es_to_ru','fill_letter','order_letters','listen_choose','listen_write','true_false'];
    runSession(area,ALL,22,(correct,total)=>{
      const pct=Math.round(correct/total*100);addXP(pct>=80?30:10);
      area.innerHTML=`<div class="excard es2">
        <div class="ey">${pct>=80?'¡Aprobado!':'Seguí practicando'}</div>
        <div class="scr">${pct}%</div>
        <p style="color:var(--muted);margin-top:5px;">${correct} de ${total} respuestas correctas</p>
        ${pct>=80?`<p style="color:var(--green);margin-top:12px;">Dominás la Unidad 3.</p>`:
        `<div class="rl"><p style="color:var(--text);margin-bottom:7px;font-weight:600;">Antes de reintentar:</p><ul><li>Repasá la sección Género, prestando atención a las excepciones.</li><li>Practicá el plural y la concordancia de adjetivos.</li></ul></div>`}
        </div>`;
      const btns=document.createElement('div');btns.style.cssText='display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center;';
      const r=document.createElement('button');r.className='btn pr';r.textContent='Reintentar';
      r.addEventListener('click',()=>{area.innerHTML='';intro.style.display='';startBtn.textContent='Empezar examen';});
      const a=document.createElement('button');a.className='btn';a.textContent='Ir al género';
      a.addEventListener('click',()=>navTo('unit3',1));
      btns.appendChild(r);btns.appendChild(a);area.querySelector('.excard').appendChild(btns);
    });
  });
  intro.appendChild(startBtn);el.appendChild(intro);el.appendChild(area);

  // Proyecto final: descripción libre
  const proj=document.createElement('div');proj.className='card sb';proj.style.marginTop='24px';
  proj.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Proyecto final</div>
    <p style="color:var(--sub);font-size:13.5px;margin-bottom:12px;line-height:1.7;">Escribí una descripción corta (5-8 frases) de tu casa, tu familia o un lugar que te guste, usando sustantivos y adjetivos de esta unidad. Ejemplo: <i>Дом большой. Есть кухня. Есть окно. Есть стол.</i></p>
    <textarea class="notein" id="projText" placeholder="Escribí acá tu descripción en ruso…"></textarea>
    <button class="btn pr" id="projSave" style="margin-top:10px;">Guardar en mi cuaderno</button>
    <div id="projList" style="margin-top:14px;"></div>`;
  el.appendChild(proj);
  function renderProjList(){
    const list=document.getElementById('projList');
    if(!list)return;
    list.innerHTML='';
    const notes=(NB.notes||[]).filter(n=>n.unit===3);
    if(notes.length===0){list.innerHTML='<div class="empty">Todavía no guardaste ninguna descripción.</div>';return;}
    notes.slice().reverse().forEach(n=>{
      const c=document.createElement('div');c.className='ncard';
      c.innerHTML=`<button class="ndl">✕</button><div class="nd">${n.date}</div><div style="font-size:13.5px;white-space:pre-wrap;">${n.text}</div>`;
      c.querySelector('.ndl').addEventListener('click',()=>{
        NB.notes=NB.notes.filter(x=>x!==n);saveNB();renderProjList();
      });
      list.appendChild(c);
    });
  }
  document.getElementById('projSave').addEventListener('click',()=>{
    const t=document.getElementById('projText');
    if(!t.value.trim())return;
    NB.notes=NB.notes||[];
    NB.notes.push({unit:3,date:today(),text:t.value.trim()});
    saveNB();t.value='';addXP(5);toast('Guardado en tu cuaderno.');
    renderProjList();
  });
  renderProjList();
}

// ── INIT ─────────────────────────────────────────
async function init(){
  const theme=await sg('theme','dark');
  if(theme==='light')document.body.classList.add('light');
  updateThemeBtn();
  PROG=await sg('prog',{xp:0,streak:0,lastDate:null,exDone:0,timeSec:0,studyDays:[]});
  NOUN_PROG=await sg('nounProg',{});
  NB=await sg('notebook',{favs:[],notes:[]});
  history.replaceState({view:'unit3',sec:0},'','');
  navTo('unit3',0,false);
}
init();

</script>
