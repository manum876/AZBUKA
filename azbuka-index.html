<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Азбука">
<title>Азбука — Ruso desde cero</title>
<link rel="stylesheet" href="core.css">
<style>
  /* Específico de esta página: header con back-btn (no usa drawer/bnav
     porque esta es la portada del curso, no una unidad individual) */
  body{padding-bottom:calc(30px + env(safe-area-inset-bottom));}
  header{padding:calc(28px + env(safe-area-inset-top)) 20px 18px;position:relative;max-width:700px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-family:inherit;font-size:13.5px;text-decoration:none;padding:0;}
  .back-btn:hover{color:var(--gold);}
  header p{color:var(--sub);font-size:14px;line-height:1.6;max-width:520px;}
  main{max-width:700px;margin:0 auto;padding:8px 16px 20px;}
  @media(max-width:560px){.ugrid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <a class="back-btn" href="index.html">← Volver</a>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema">🌙</button>
  </div>
  <div class="ey">Ruso desde cero · A1 → B1</div>
  <h1 class="pt" style="font-size:26px;">Твой курс русского</h1>
  <p>12 unidades pensadas para un mes cada una. Empezá por el alfabeto: todo lo demás se construye sobre esto.</p>
</header>

<main>
  <div class="ugrid" id="unitsGrid"></div>
</main>

<div id="toast"></div>

<script src="core.js"></script>
<script>
function unitProgressPct(id){
  // Progreso simple y honesto: cuántos ejercicios reales se hicieron,
  // sin inventar un % ficticio de "completitud" del temario.
  const u = azUnit(id);
  return u.exDone ? Math.min(100, u.exDone) : 0; // barra visual liviana, no una métrica exacta
}
function renderUnitsGrid(){
  const grid = document.getElementById('unitsGrid');
  grid.innerHTML = AZ_UNITS.map(u=>{
    const pct = unitProgressPct(u.id);
    return `<a class="uc" href="${u.href}">
      <div class="un">${String(u.id).padStart(2,'0')}</div>
      <div class="ut">${u.title}</div>
      <div class="ud">${u.desc}</div>
      ${pct>0?`<div class="pb"><div style="width:${pct}%"></div></div>`:''}
      <span class="goLbl">${pct>0?'Continuar →':'Empezar →'}</span>
    </a>`;
  }).join('');
}

(async () => {
  await azInit({activeType:null, activeId:null}); // portada, sin unidad activa en el drawer
  renderUnitsGrid();
})();
</script>

</body>
</html>
