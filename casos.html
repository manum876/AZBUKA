<script>
// CASE_META, CASE_ORDER, GENDER_LABEL, WORDS, TEMPLATES, approxPron → data-casos.js
// sg/ss, tema, TTS, toast, drawer, azModule → core.js

/* ── UTILIDADES LOCALES ────────────────────────────────────── */
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuf(a){return[...a].sort(()=>Math.random()-.5);}
function smpl(a,n){return shuf(a).slice(0,n);}
function norm(s){return String(s).trim().toLowerCase().replace(/ё/g,'е').normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
// Evaluación indulgente para el nivel "Escribir": exacto = 1, muy cerca = 0.5
function scoreAnswer(given,answer){
  const g=norm(given),a=norm(answer);
  if(!g)return 0;
  if(g===a)return 1;
  const dist=levenshtein(g,a);
  const maxLen=Math.max(g.length,a.length);
  if(maxLen>0&&dist<=Math.max(1,Math.ceil(maxLen*0.3)))return 0.5;
  return 0;
}

/* ── ESTADO / PERSISTENCIA (azModule('casos'), sin XP ni racha) ── */
// Schema: { levelStats:{"case-level":{correct,total,bestAccuracy,attempts}},
//           caseStats:{case:{correct,total}}, wrongWords:{ru:count}, cursors:{} }
function casosMod(){ const m=azModule('casos'); m.levelStats=m.levelStats||{}; m.caseStats=m.caseStats||{}; m.wrongWords=m.wrongWords||{}; m.cursors=m.cursors||{}; return m; }
function recordAnswer(caseKey,score,wordRu){
  const m=casosMod();
  if(caseKey){
    const cs=m.caseStats[caseKey]||{correct:0,total:0};
    cs.total++; cs.correct+=score;
    m.caseStats[caseKey]=cs;
  }
  if(score<1 && wordRu){ m.wrongWords[wordRu]=(m.wrongWords[wordRu]||0)+1; }
  azSaveProgress();
}
function recordLevelResult(key,correctSum,total){
  const m=casosMod();
  const acc=Math.round(correctSum/total*100);
  const s=m.levelStats[key]||{correct:0,total:0,bestAccuracy:0,attempts:0};
  s.correct+=correctSum; s.total+=total; s.attempts++;
  s.bestAccuracy=Math.max(s.bestAccuracy,acc);
  m.levelStats[key]=s;
  azTouchStudied(); azSaveProgress();
  return acc;
}
function bestAccFor(caseKey){
  const m=casosMod();
  const keys=[1,2,3].map(l=>`${caseKey}-${l}`);
  const accs=keys.map(k=>(m.levelStats[k]||{}).bestAccuracy||0);
  return Math.round(accs.reduce((a,b)=>a+b,0)/3);
}
function nextWordBatch(key,count){
  const m=casosMod();
  const n=WORDS.length;
  let cursor=m.cursors[key]||0;
  const batch=[];
  for(let i=0;i<count;i++) batch.push(WORDS[(cursor+i)%n]);
  m.cursors[key]=(cursor+count)%n;
  azSaveProgress();
  return batch;
}

/* ── NIVELES ─────────────────────────────────────────────────
   1 = Reconocer (mcq directa: género/animacidad en Nom., forma en el resto)
   2 = Completar la frase (mcq en contexto — reemplaza al viejo nivel 2 y 3)
   3 = Escribir la forma (input libre, evaluación indulgente)          */
const LEVEL_INFO=[
  {n:1,title:'Reconocer',desc:'Identificá género, animacidad o la forma correcta entre 4 opciones.'},
  {n:2,title:'Completar la frase',desc:'Elegí la forma correcta dentro de una oración real.'},
  {n:3,title:'Escribir',desc:'Se te da la palabra base — escribís vos la forma declinada.'}
];

function distractorsFor(word,caseKey){
  const others=CASE_ORDER.filter(c=>c!==caseKey).map(c=>word.forms[c]);
  return shuf([...new Set(others)].filter(f=>f!==word.forms[caseKey])).slice(0,3);
}

function buildLevel1(word,caseKey){
  if(caseKey==='nom'){
    const askGender=Math.random()<0.6;
    if(askGender){
      return {type:'mcq',caseKey:'nom',wordRu:word.ru,
        prompt:`¿Qué género tiene «${word.ru}»?`,cy:word.ru,tr:approxPron(word.ru),
        options:shuf(['masculino','femenino','neutro']),correct:GENDER_LABEL[word.gender],
        explain:`«${word.ru}» (${word.es}) es <b>${GENDER_LABEL[word.gender]}</b>${word.animate?' y animado':''}.`};
    }
    return {type:'mcq',caseKey:'nom',wordRu:word.ru,
      prompt:`¿«${word.ru}» es animado o inanimado?`,cy:word.ru,tr:approxPron(word.ru),
      options:['Animado','Inanimado'],correct:word.animate?'Animado':'Inanimado',
      explain:`«${word.ru}» (${word.es}) es <b>${word.animate?'animado':'inanimado'}</b>. Los animados son personas y animales — es clave para el acusativo.`};
  }
  const correct=word.forms[caseKey];
  const opts=distractorsFor(word,caseKey);
  while(opts.length<3){ const o=rnd(WORDS).forms[caseKey]; if(o!==correct&&!opts.includes(o))opts.push(o); }
  return {type:'mcq',caseKey,wordRu:word.ru,
    prompt:`¿Cuál es la forma de <b>${CASE_META[caseKey].es}</b> de «${word.ru}» (${word.es})?`,cy:word.ru,tr:approxPron(word.ru),
    options:shuf([correct,...opts]),correct,
    explain:explainCase(word,caseKey)};
}
function buildLevel2(word,caseKey){
  const t=rnd(TEMPLATES[caseKey]);
  const correct=word.forms[caseKey];
  const opts=distractorsFor(word,caseKey);
  while(opts.length<3){ const o=rnd(WORDS).forms[caseKey]; if(o!==correct&&!opts.includes(o))opts.push(o); }
  return {type:'mcq',caseKey,wordRu:word.ru,
    prompt:`Completá: <i>${t.es.replace('___','___')}</i> — («${word.es}»)`,
    cy:t.pre+'____'+t.post,tr:'',
    options:shuf([correct,...opts]),correct,
    explain:explainCase(word,caseKey)+` Frase completa: «${t.pre}${correct}${t.post}»`};
}
function buildLevel3(word,caseKey){
  const t=rnd(TEMPLATES[caseKey]);
  const correct=word.forms[caseKey];
  return {type:'fill',caseKey,wordRu:word.ru,
    prompt:`Escribí la forma de <b>${CASE_META[caseKey].es}</b> de «${word.ru}» (${word.es}) para completar:`,
    cy:t.pre+'____'+t.post,tr:approxPron(word.ru),
    correct,
    explain:explainCase(word,caseKey)+` Frase completa: «${t.pre}${correct}${t.post}»`};
}
function explainCase(word,caseKey){
  const meta=CASE_META[caseKey];
  let animNote='';
  if(caseKey==='acc'){
    animNote=word.animate
      ? ` Como «${word.ru}» es animado, el acusativo copia al genitivo (${word.forms.gen}).`
      : ` Como «${word.ru}» es inanimado, el acusativo es igual al nominativo (${word.forms.nom}).`;
  }
  return `<b>${meta.es} (${meta.short})</b> — ${meta.rule}${animNote}`;
}
function buildSession(caseKey,level,count){
  const batch=nextWordBatch(`${caseKey}-${level}`,count);
  const builder=level===1?buildLevel1:level===2?buildLevel2:buildLevel3;
  return shuf(batch.map(w=>builder(w,caseKey)));
}
function buildMixedSession(count){
  const batch=nextWordBatch('mix',count);
  return shuf(batch.map(w=>{
    const c=CASE_ORDER[1+Math.floor(Math.random()*5)];
    return Math.random()<0.5?buildLevel1(w,c):buildLevel2(w,c);
  }));
}
function buildReviewSession(){
  const m=casosMod();
  const entries=Object.entries(m.wrongWords).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const targetWords=entries.map(([ru])=>WORDS.find(w=>w.ru===ru)).filter(Boolean);
  const pool=targetWords.length?targetWords:smpl(WORDS,10);
  return shuf(pool.map(w=>{
    const c=CASE_ORDER[1+Math.floor(Math.random()*5)];
    return Math.random()<0.5?buildLevel1(w,c):buildLevel2(w,c);
  }));
}

/* ── ESTADO DE NAVEGACIÓN ──────────────────────────────────── */
let VIEW='home';
let selectedCase=null;
let session=null; // {statKey, caseKeyForStats, queue, idx, correctSum, answered}

function go(view,extra){
  VIEW=view;
  if(extra) Object.assign(window,extra);
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

function render(){
  const app=document.getElementById('app');
  let html='';
  if(VIEW==='home') html=renderHome();
  else if(VIEW==='caseDetail') html=renderCaseDetail();
  else if(VIEW==='practiceMenu') html=renderPracticeMenu();
  else if(VIEW==='session') html=renderSession();
  else if(VIEW==='results') html=renderResults();
  else if(VIEW==='dict') html=renderDict();
  else if(VIEW==='progress') html=renderProgress();
  app.innerHTML=`<div class="view active">${html}</div>`;
  attachHandlers();
  setActiveNav();
}
function setActiveNav(){
  document.querySelectorAll('#bnav .nb').forEach(b=>b.classList.remove('ac'));
  const map={home:'nav-home',caseDetail:'nav-home',practiceMenu:'nav-practice',session:'nav-practice',results:'nav-practice',dict:'nav-dict',progress:'nav-progress'};
  const id=map[VIEW]; if(id) document.getElementById(id).classList.add('ac');
}

/* ── HOME: grilla de los 6 casos ───────────────────────────── */
function renderHome(){
  let out=`<div class="ey">Gramática</div><h1 class="pt">Los 6 casos del ruso</h1>
  <p class="ps">En ruso, la terminación de cada sustantivo cambia según su función en la frase. Elegí un caso para ver la regla y practicar.</p>
  <div class="ugrid">`;
  CASE_ORDER.forEach(c=>{
    const meta=CASE_META[c];
    const acc=bestAccFor(c);
    out+=`<a class="uc" data-case="${c}" style="cursor:pointer;">
      <div class="un" style="color:${meta.color};">${meta.short}</div>
      <div class="ut">${meta.es}</div>
      <div class="ud">${meta.rule.split('.')[0]}.</div>
      ${acc>0?`<div class="pb"><div style="width:${acc}%"></div></div>`:''}
      <span class="goLbl">${acc>0?`${acc}% · Seguir →`:'Empezar →'}</span>
    </a>`;
  });
  out+=`</div>`;
  return out;
}

/* ── DETALLE DE CASO: teoría + 3 niveles ───────────────────── */
function renderCaseDetail(){
  const c=selectedCase, meta=CASE_META[c];
  let out=`<button class="abk" data-go="home">← Los 6 casos</button>
  <div class="sh"><span class="shi">${meta.short}</span><div><h2>${meta.es}</h2><div class="shs">${bestAccFor(c)}% de precisión acumulada</div></div></div>
  <div class="card sb">
    <p style="color:var(--sub);font-size:14.5px;line-height:1.8;margin-bottom:10px;">${meta.rule}</p>
    <p style="color:var(--gold);font-size:13.5px;font-style:italic;">${meta.example}</p>
  </div>
  <div class="sh"><h2>Elegí un nivel</h2></div>
  <div class="pmgrid sb">`;
  LEVEL_INFO.forEach(L=>{
    const m=casosMod();
    const st=m.levelStats[`${c}-${L.n}`];
    out+=`<div class="pmc" data-level="${L.n}">
      <span class="ic">${L.n===1?'🎯':L.n===2?'📝':'✏️'}</span>
      <div><b>${L.title}</b><span>${L.desc}</span>${st?`<div class="dim" style="margin-top:4px;">Mejor: ${st.bestAccuracy}% · ${st.attempts} sesión(es)</div>`:''}</div>
    </div>`;
  });
  out+=`</div>`;
  return out;
}

/* ── MENÚ DE PRÁCTICA (nav inferior) ───────────────────────── */
function renderPracticeMenu(){
  const m=casosMod();
  const wrongCount=Object.keys(m.wrongWords).length;
  return `<div class="ey">Práctica</div><h1 class="pt">Elegí un modo</h1>
  <div class="pmgrid sb">
    <div class="pmc" data-go="home"><span class="ic">🧩</span><div><b>Por caso</b><span>Elegí uno de los 6 casos y su nivel</span></div></div>
    <div class="pmc" data-mixed="1"><span class="ic">🔀</span><div><b>Simulacro mixto</b><span>20 preguntas combinando los 6 casos</span></div></div>
    <div class="pmc" ${wrongCount?'data-review="1"':''} style="${wrongCount?'':'opacity:.45;'}"><span class="ic">🔁</span><div><b>Repaso inteligente</b><span>${wrongCount?`Reforzá las ${wrongCount} palabras que más te costaron`:'Todavía no tenés palabras para repasar'}</span></div></div>
  </div>`;
}

/* ── SESIÓN DE EJERCICIOS (reutiliza clases excard/og/oo/qopts/ti/fb de core.css) ── */
function startSession(statKey,caseKeyForStats,queue){
  session={statKey,caseKeyForStats,queue,idx:0,correctSum:0,answered:false};
  go('session');
}
function renderSession(){
  const s=session;
  if(s.idx>=s.queue.length){ go('results'); return ''; }
  const ex=s.queue[s.idx];
  s.answered=false;
  const pct=Math.round(s.idx/s.queue.length*100);
  let out=`<div class="epb"><div style="width:${pct}%"></div></div>
  <div class="excard">
    <div class="exkind">${CASE_META[ex.caseKey]?CASE_META[ex.caseKey].es:'Repaso'} · ${s.idx+1}/${s.queue.length}</div>
    <div class="exq">${ex.prompt}${ex.cy?`<span class="excy">${ex.cy} <button class="psm" data-speak="${ex.wordRu}" style="width:26px;height:26px;font-size:11px;vertical-align:middle;">🔊</button></span>`:''}</div>
    <div id="exBody"></div><div class="fb" id="exFB"></div>
    <div class="exac"><button class="btn gh" id="exSkip">Saltar</button><button class="btn pr" id="exCheck" style="display:none;">Comprobar</button><button class="btn pr" id="exNext" style="display:none;">Siguiente →</button></div>
  </div>`;
  setTimeout(()=>buildExBody(ex),0);
  return out;
}
function buildExBody(ex){
  const body=document.getElementById('exBody');
  if(!body) return;
  if(ex.type==='mcq'){
    const g=document.createElement('div');g.className='og';
    ex.options.forEach(opt=>{
      const b=document.createElement('button');b.className='oo';b.textContent=opt;
      b.addEventListener('click',()=>submitAnswer(ex,opt,b,g));
      g.appendChild(b);
    });
    body.appendChild(g);
  } else if(ex.type==='fill'){
    const inp=document.createElement('input');inp.className='ti';inp.placeholder='Escribí en cirílico…';
    body.appendChild(inp);inp.focus();
    const ck=document.getElementById('exCheck');ck.style.display='inline-flex';
    const go2=()=>submitAnswer(ex,inp.value,inp,null);
    ck.addEventListener('click',go2);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')go2();});
  }
}
function submitAnswer(ex,given,node,grid){
  const s=session;
  if(s.answered) return;
  s.answered=true;
  let score = ex.type==='fill' ? scoreAnswer(given,ex.correct) : (norm(given)===norm(ex.correct)?1:0);
  const ok=score===1, partial=score===0.5;
  s.correctSum+=score;
  recordAnswer(ex.caseKey==='nom'?null:ex.caseKey, score, ex.wordRu);
  if(grid) grid.querySelectorAll('.oo').forEach(o=>{
    if(o.textContent===ex.correct) o.classList.add('co');
    else if(o.textContent===given && !ok) o.classList.add('wr2');
    o.disabled=true;
  });
  if(node && node.tagName==='INPUT'){ node.classList.add(ok?'co':partial?'pc':'wr2'); node.disabled=true; }
  const ckBtn=document.getElementById('exCheck'); if(ckBtn) ckBtn.style.display='none';
  document.getElementById('exSkip').style.display='none';
  document.getElementById('exNext').style.display='inline-flex';
  document.getElementById('exNext').addEventListener('click',()=>{ session.idx++; render(); });
  const fb=document.getElementById('exFB');
  fb.className='fb show '+(ok?'ok':partial?'partial':'bad');
  fb.innerHTML=(ok?'<b>✓ Correcto.</b> ':partial?'<b>½ Casi.</b> ':'<b>✗ Incorrecto.</b> ')+ex.explain;
}

/* ── RESULTADOS ─────────────────────────────────────────────── */
function renderResults(){
  const s=session;
  const acc=recordLevelResult(s.statKey,s.correctSum,s.queue.length);
  return `<div class="excard es2">
    <div class="ey">${acc>=80?'¡Muy bien!':acc>=50?'Vas bien':'Seguí practicando'}</div>
    <div class="scr">${acc}%</div>
    <p style="color:var(--muted);margin-top:6px;">${Math.round(s.correctSum*10)/10} de ${s.queue.length} correctas</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;">
      <button class="btn pr" data-again="1">Otra ronda</button>
      <button class="btn" data-go="home">Volver a los casos</button>
    </div>
  </div>`;
}

/* ── DICCIONARIO (buscador + tabla de declinación por palabra) ── */
let dictQuery='';
let dictOpen=null;
function renderDict(){
  const items=WORDS.filter(w=>{
    if(!dictQuery) return true;
    const q=dictQuery.toLowerCase();
    return w.ru.toLowerCase().includes(q)||w.es.toLowerCase().includes(q);
  }).slice(0,dictQuery?200:40);
  let out=`<div class="ey">Diccionario</div><h1 class="pt">${WORDS.length} sustantivos declinados</h1>
  <div class="gsearch sb">
    <span class="gsi">🔍</span>
    <input type="text" id="dictSearch" placeholder="Buscar en ruso o español…" value="${dictQuery}">
  </div>`;
  if(!items.length){ out+=`<div class="empty">Sin resultados.</div>`; return out; }
  items.forEach(w=>{
    const isOpen=dictOpen===w.id;
    out+=`<div class="wcard" style="flex-direction:column;align-items:stretch;" data-dictword="${w.id}">
      <div style="display:flex;align-items:center;gap:10px;cursor:pointer;">
        <div class="wru" style="min-width:auto;">${w.ru}</div>
        <div class="wi"><div class="wtr">/${approxPron(w.ru)}/ · ${GENDER_LABEL[w.gender]}${w.animate?', animado':''}</div><div class="wes">${w.es}</div></div>
        <button class="psm" data-speak="${w.ru}">▶</button>
        <span style="color:var(--muted);font-size:12px;">${isOpen?'▲':'▼'}</span>
      </div>
      ${isOpen?`<table class="casetbl">${CASE_ORDER.map(c=>`<tr><td>${CASE_META[c].es}</td><td>${w.forms[c]}</td></tr>`).join('')}</table>`:''}
    </div>`;
  });
  if(!dictQuery && WORDS.length>40) out+=`<div class="empty">Mostrando 40 de ${WORDS.length}. Escribí para buscar el resto.</div>`;
  return out;
}

/* ── PROGRESO (stats sin XP ni racha) ──────────────────────── */
function renderProgress(){
  const m=casosMod();
  const totalAnswered=Object.values(m.caseStats).reduce((a,c)=>a+c.total,0);
  const totalCorrect=Object.values(m.caseStats).reduce((a,c)=>a+c.correct,0);
  const overallAcc=totalAnswered?Math.round(totalCorrect/totalAnswered*100):0;
  let out=`<div class="ey">Tu progreso</div><h1 class="pt">Casos</h1>
  <div class="sr sb">
    <div class="sc"><span class="sv">${overallAcc}%</span><span class="sl">Precisión global</span></div>
    <div class="sc"><span class="sv">${totalAnswered}</span><span class="sl">Ejercicios resueltos</span></div>
  </div>
  <div class="sh"><h2>Por caso</h2></div>`;
  CASE_ORDER.forEach(c=>{
    const cs=m.caseStats[c]||{correct:0,total:0};
    const pct=cs.total?Math.round(cs.correct/cs.total*100):0;
    out+=`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>${CASE_META[c].es}</span><span class="dim">${cs.total?`${pct}%`:'Sin datos'}</span></div><div class="pb"><div style="width:${pct}%"></div></div></div>`;
  });
  const worst=Object.entries(m.wrongWords).sort((a,b)=>b[1]-a[1]).slice(0,8);
  out+=`<div class="sh"><h2>Palabras más difíciles</h2></div>`;
  out+= worst.length
    ? worst.map(([ru,c])=>{const w=WORDS.find(x=>x.ru===ru);return `<div class="wr"><div style="flex:1;"><div class="wru" style="font-size:16px;">${ru}</div><div class="wes">${w?w.es:''}</div></div><span class="stb s0">${c} error${c===1?'':'es'}</span></div>`;}).join('')
    : `<div class="empty">Todavía sin errores registrados.</div>`;
  return out;
}

/* ── HANDLERS ───────────────────────────────────────────────── */
function attachHandlers(){
  document.querySelectorAll('[data-case]').forEach(el=>el.addEventListener('click',()=>{selectedCase=el.dataset.case;go('caseDetail');}));
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
  document.querySelectorAll('[data-level]').forEach(el=>el.addEventListener('click',()=>{
    const level=parseInt(el.dataset.level,10);
    startSession(`${selectedCase}-${level}`,selectedCase,buildSession(selectedCase,level,12));
  }));
  document.querySelectorAll('[data-mixed]').forEach(el=>el.addEventListener('click',()=>startSession('mix-0',null,buildMixedSession(20))));
  document.querySelectorAll('[data-review]').forEach(el=>el.addEventListener('click',()=>startSession('mix-0',null,buildReviewSession())));
  document.querySelectorAll('[data-again]').forEach(el=>el.addEventListener('click',()=>{
    const q = session.caseKeyForStats
      ? buildSession(session.caseKeyForStats, parseInt(session.statKey.split('-')[1],10), session.queue.length)
      : buildMixedSession(session.queue.length);
    startSession(session.statKey, session.caseKeyForStats, q);
  }));
  document.querySelectorAll('[data-speak]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();speak(el.dataset.speak);}));
  document.querySelectorAll('[data-dictword]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target.closest('[data-speak]')) return;
    const id=el.dataset.dictword;
    dictOpen = dictOpen===id ? null : id;
    render();
  }));
  const ds=document.getElementById('dictSearch');
  if(ds){ ds.addEventListener('input',()=>{dictQuery=ds.value;dictOpen=null;render();}); setTimeout(()=>{const el=document.getElementById('dictSearch'); if(el && document.activeElement!==el && dictQuery){} },0); }
}

document.getElementById('nav-home').addEventListener('click',()=>go('home'));
document.getElementById('nav-practice').addEventListener('click',()=>go('practiceMenu'));
document.getElementById('nav-dict').addEventListener('click',()=>go('dict'));
document.getElementById('nav-progress').addEventListener('click',()=>go('progress'));

(async () => {
  await azInit({activeType:'module', activeId:'casos'});
  azRegisterSearchEntries('casos', 'Casos', 'casos.html', getAllCasosWords());
  render();
})();
</script>
