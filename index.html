<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Азбука">
<title>Азбука · Ruso</title>
<link rel="stylesheet" href="core.css">
<style>
  /* Estilos específicos de esta página (no van en core.css porque
     solo se usan acá: el header grande y la search bar de home) */
  body{padding-bottom:calc(30px + env(safe-area-inset-bottom));}
  header{padding:calc(32px + env(safe-area-inset-top)) 20px 20px;text-align:center;position:relative;max-width:700px;margin:0 auto;}
  .theme-btn{position:absolute;top:calc(20px + env(safe-area-inset-top));right:16px;width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--text);}
  .theme-btn:active{background:var(--bg3);}
  header .cyr{font-size:14px;letter-spacing:0.35em;color:var(--gold);text-transform:uppercase;font-weight:600;margin-bottom:8px;}
  header h1{font-size:26px;font-weight:700;letter-spacing:-0.01em;color:var(--text);}
  header p{margin-top:6px;color:var(--sub);font-size:14px;}
  main{max-width:700px;margin:0 auto;padding:8px 16px 20px;}
  .section-lbl{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);margin:24px 0 10px;font-weight:600;}
  a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);}
  .card-text h2{margin:0 0 3px;font-size:16px;font-weight:600;}
  .card-text p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35;}
  .hint{max-width:700px;margin:20px auto 0;padding:0 20px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center;}
</style>
</head>
<body>

<header>
  <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema">🌙</button>
  <div class="cyr">Азбука</div>
  <h1>Ruso desde cero</h1>
  <p>Elegí una app para empezar</p>
</header>

<main>

  <div class="gsearch">
    <span class="gsi">🔍</span>
    <input type="text" id="globalSearch" placeholder="Buscar cualquier palabra, en cualquier módulo…" autocomplete="off">
    <button class="gsc" id="gsClear">✕</button>
  </div>
  <div id="searchResults"></div>

  <div id="homeSections">
    <div class="section-lbl">Curso principal</div>
    <div class="ugrid">
      <a class="card uc" href="azbuka-index.html">
        <div class="icon red">А</div>
        <div class="card-text">
          <h2>Curso Азбука</h2>
          <p>12 unidades A1–B1, con progreso guardado</p>
        </div>
      </a>
    </div>

    <div class="section-lbl">Módulos independientes</div>
    <div class="ugrid" id="modulesGrid"></div>
  </div>

</main>

<p class="hint">
  El progreso se guarda automáticamente y es el mismo en todos los módulos y unidades.
</p>

<div id="toast"></div>

<script src="core.js"></script>
<script>
function renderModulesGrid(){
  const grid = document.getElementById('modulesGrid');
  grid.innerHTML = AZ_MODULES.map(m=>`
    <a class="card uc" href="${m.href}">
      <div class="icon ${m.icon}">${m.glyph}</div>
      <div class="card-text">
        <h2>${m.title}</h2>
        <p>${m.desc}</p>
      </div>
    </a>`).join('');
}

function renderSearchResults(query){
  const box = document.getElementById('searchResults');
  const homeSections = document.getElementById('homeSections');
  const clearBtn = document.getElementById('gsClear');
  if(!query){
    box.innerHTML = '';
    homeSections.style.display = '';
    clearBtn.style.display = 'none';
    return;
  }
  clearBtn.style.display = 'block';
  homeSections.style.display = 'none';
  const results = azSearch(query);
  if(results.length === 0){
    box.innerHTML = '<div class="empty">Sin resultados. El índice de búsqueda se completa a medida que sumamos módulos.</div>';
    return;
  }
  box.innerHTML = results.map(r=>`
    <a class="gresult" href="${r.href}">
      <div style="flex:1;">
        <div class="gmod">${r.moduleLabel}</div>
        <div style="font-family:var(--serif);font-size:16px;">${r.ru}</div>
        <div style="font-size:12.5px;color:var(--sub);">${r.es}</div>
      </div>
    </a>`).join('');
}

document.getElementById('globalSearch').addEventListener('input', e=>renderSearchResults(e.target.value));
document.getElementById('gsClear').addEventListener('click', ()=>{
  document.getElementById('globalSearch').value = '';
  renderSearchResults('');
});

renderModulesGrid();
azInit({activeType:null, activeId:null}); // home no tiene unidad/módulo activo
</script>

</body>
</html>
