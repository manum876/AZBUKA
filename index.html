<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Азбука">
<title>Азбука · Ruso</title>
<link rel="stylesheet" href="core.css">
<style>
  /* Específico de esta página */
  .home-header{padding:6vh 3vw 4px;max-width:700px;margin:0 auto;}
  .brand-title{font-family:var(--serif);font-size:26px;font-weight:800;letter-spacing:-0.01em;color:var(--gold);line-height:1;}
  .tagline{margin-top:4px;color:var(--sub);font-size:13px;font-weight:500;}

  /* Hero card (Curso Азбука): ancho completo, ícono grande a la altura
     de la card, título al lado, tagline abajo ocupando todo el ancho */
  .hero-card{display:block;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--text);margin-bottom:22px;}
  .hero-row{display:flex;align-items:center;gap:14px;}
  .hero-row .icon{width:58px;height:58px;border-radius:14px;font-size:24px;flex-shrink:0;}
  .hero-row h2{margin:0;font-size:18px;font-weight:700;}
  .hero-card p{margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4;}

  /* Tools grid: igual que antes, ícono+título en fila, tagline abajo */
  a.card{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);padding:10px 12px;}
  .card-row{display:flex;align-items:center;gap:9px;}
  .card-row .icon{width:32px;height:32px;border-radius:9px;font-size:14px;flex-shrink:0;}
  .card-row h2{margin:0;font-size:14.5px;font-weight:600;}
  a.card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.3;}

  /* Estilos del drawer (búsqueda, home, tema) ahora viven en core.css */
</style>
</head>
<body>

<div id="overlay"></div>
<div id="drawer">
  <div class="dh"><a id="homeBtnDrawer" href="index.html">🏠 Inicio</a></div>
  <div class="drawer-search">
    <input type="text" id="drawerSearch" placeholder="Buscar…" autocomplete="off">
  </div>
  <div id="drawerUnits"></div>
  <div id="drawerFoot">
    <button id="themeBtnDrawer" aria-label="Cambiar tema"></button>
  </div>
</div>

<div id="content">
  <div class="home-header">
    <div class="brand-title">Азбука</div>
    <p class="tagline">Ruso desde cero</p>
  </div>

  <div class="inner" style="padding-top:8px;">
    <a class="hero-card" href="azbuka-index.html">
      <div class="hero-row">
        <div class="icon red">А</div>
        <h2>Curso Азбука</h2>
      </div>
      <p>12 unidades A1–B1, con progreso guardado</p>
    </a>

    <div class="section-lbl" style="margin-top:0;">Herramientas</div>
    <div class="ugrid" id="modulesGrid"></div>
  </div>
</div>

<nav id="bnav">
  <button class="nb ac" id="menuBtn"><span class="ni">☰</span><span>Menú</span></button>
  <div id="navMid"><b>Азбука</b><span>Ruso desde cero</span></div>
</nav>

<div id="toast"></div>

<script src="core.js"></script>
<script src="data-alphabet.js"></script>
<script src="data-diccionario.js"></script>
<script src="data-verbos.js"></script>
<script src="data-casos.js"></script>
<script src="data-azbuka2.js"></script>
<script src="data-azbuka3.js"></script>
<script src="data-dialogos.js"></script>
<script src="data-azbuka1.js"></script>
<script src="data-lexicon.js"></script>
<script>
function renderModulesGrid(){
  const grid = document.getElementById('modulesGrid');
  grid.innerHTML = AZ_MODULES.map(m=>`
    <a class="card uc" href="${m.href}">
      <div class="card-row">
        <div class="icon ${m.icon}">${m.glyph}</div>
        <h2>${m.title}</h2>
      </div>
      <p>${m.desc}</p>
    </a>`).join('');
}

renderModulesGrid();
// home: sin unidad/módulo activo en el drawer. El registro del buscador
// transversal (diccionario/verbos/casos/alfabeto) ahora es automático,
// azInit() lo hace por su cuenta con azRegisterAllKnownSearchIndexes().
azInit({activeType:null, activeId:null});
</script>

</body>
</html>
