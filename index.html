<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Азбука">
<title>Азбука · Ruso</title>
<link rel="stylesheet" href="core.css">
<style>
  /* Estilos específicos de esta página. Todo pensado para entrar en
     una sola pantalla de celular sin scroll: paddings ajustados,
     header compacto y cards bajas. */
  html,body{height:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;}

  header{padding:calc(14px + env(safe-area-inset-top)) 20px 10px;max-width:700px;margin:0 auto;width:100%;flex-shrink:0;}
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .brand-title{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:-0.01em;color:var(--gold);line-height:1;}
  .tagline{margin-top:5px;color:var(--sub);font-size:13px;font-weight:500;}
  .theme-btn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text);flex-shrink:0;}
  .theme-btn:active{background:var(--bg3);}

  main{max-width:700px;margin:0 auto;padding:6px 16px calc(10px + env(safe-area-inset-bottom));width:100%;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
  .section-lbl{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin:14px 0 8px;font-weight:600;flex-shrink:0;}
  .section-lbl:first-child{margin-top:2px;}

  /* Cards horizontales y bajas: ícono+título en una fila, subtítulo abajo */
  a.card{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);padding:10px 12px;}
  .card-row{display:flex;align-items:center;gap:9px;}
  .card-row .icon{width:32px;height:32px;border-radius:9px;font-size:14px;flex-shrink:0;}
  .card-row h2{margin:0;font-size:14.5px;font-weight:600;}
  a.card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.3;}

  .gsearch{margin-bottom:0;flex-shrink:0;}
  .gsearch input{width:100%;box-sizing:border-box;}
  #searchResults{overflow-y:auto;flex:1;min-height:0;}
  #homeSections{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="brand-title">Азбука</div>
      <p class="tagline">Ruso desde cero</p>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema">🌙</button>
  </div>
</header>

<main>

  <div class="gsearch">
    <span class="gsi">🔍</span>
    <input type="text" id="globalSearch" placeholder="Buscar cualquier palabra…" autocomplete="off">
    <button class="gsc" id="gsClear">✕</button>
  </div>
  <div id="searchResults"></div>

  <div id="homeSections">
    <div class="section-lbl">Curso principal</div>
    <div class="ugrid">
      <a class="card uc" href="azbuka-index.html">
        <div class="card-row">
          <div class="icon red">А</div>
          <h2>Curso Азбука</h2>
        </div>
        <p>12 unidades A1–B1, con progreso guardado</p>
      </a>
    </div>

    <div class="section-lbl">Herramientas</div>
    <div class="ugrid" id="modulesGrid"></div>
  </div>

</main>

<div id="toast"></div>

<script src="core.js"></script>
<script src="data-diccionario.js"></script>
<script src="data-verbos.js"></script>
<script>
function renderModulesGrid(){
  const grid = document.getElementById('modulesGrid');
  grid.innerHTML = AZ_MODULES.map(m=>`
    <a class="card uc" href="${m.href}">
      <div class="card-row">
        <div class="icon ${m.icon}">${m.glyph}</div>
        <h2>${m.title}</h2>
      </div>
      <p>${m.desc}</p>
    </a>`).join('');
}

function renderSearchResults(query){
  const box = document.getElementById('searchResults');
  const homeSections = document.getElementById('homeSections');
  const clearBtn = document.getElementById('gsClear');
  if(!query){
    box.innerHTML = '';
    box.style.display = 'none';
    homeSections.style.display = '';
    clearBtn.style.display = 'none';
    return;
  }
  clearBtn.style.display = 'block';
  homeSections.style.display = 'none';
  box.style.display = '';
  const results = azSearch(query);
  if(results.length === 0){
    box.innerHTML = '<div class="empty">Sin resultados. El índice de búsqueda se completa a medida que sumamos módulos.</div>';
    return;
  }
  box.innerHTML = results.map(r=>`
    <a class="gresult" href="${r.href}">
      <div style="flex:1;">
        <div class="gmod">${r.moduleLabel}</div>
        <div style="font-family:var(--serif);font-size:16px;">${r.ru}</div>
        <div style="font-size:12.5px;color:var(--sub);">${r.es}</div>
      </div>
    </a>`).join('');
}

document.getElementById('globalSearch').addEventListener('input', e=>renderSearchResults(e.target.value));
document.getElementById('gsClear').addEventListener('click', ()=>{
  document.getElementById('globalSearch').value = '';
  renderSearchResults('');
});

renderModulesGrid();
azInit({activeType:null, activeId:null}); // home no tiene unidad/módulo activo

// Poblar el buscador global con los módulos que ya exponen sus datos.
// Cada módulo nuevo que sume su data-*.js se registra acá en una línea.
azRegisterSearchEntries('diccionario', 'Diccionario temático', 'diccionario.html',
  getAllDiccionarioWords().map(w=>({ru:w.ru, es:w.es, tr:w.pronun})));
azRegisterSearchEntries('verbos', 'Verbos frecuentes', 'verbos.html',
  verbs.map(v=>({ru:v.inf, es:v.es, tr:''})));
</script>

</body>
</html>
